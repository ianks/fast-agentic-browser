[package]
name = "fast-agentic-browser"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fast agentic browser: a CLI that lets AI agents browse, fill forms, sign in and scrape the web in plain English, streaming JSON"
repository = "https://github.com/ianks/fast-agentic-browser"
homepage = "https://github.com/ianks/fast-agentic-browser"
readme = "../../README.md"
keywords = ["browser", "agent", "llm", "scraping", "automation"]
categories = ["command-line-utilities", "web-programming", "development-tools::testing"]
default-run = "fab"

[lib]
name = "fab_cli"
path = "src/lib.rs"

[[bin]]
name = "fab"
path = "src/main.rs"

[[bin]]
name = "fab-bench"
path = "src/bin/fab-bench.rs"
# Development only: `cargo install` leaves it out.
required-features = ["bench"]

[features]
# Builds fab-bench, the benchmark and eval harness.
bench = []

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
fab-core = { version = "0.1.0", path = "../fab-core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
fs2 = "0.4.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
