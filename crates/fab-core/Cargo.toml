[package]
name = "fab-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Engine of fab, the fast agentic browser: compact DOM snapshots, page-level decisions, in-page scraping and a small script VM"
repository = "https://github.com/ianks/fast-agentic-browser"
homepage = "https://github.com/ianks/fast-agentic-browser"
readme = "../../README.md"
keywords = ["browser", "agent", "llm", "scraping", "dom"]
categories = ["web-programming", "parsing"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
futures-util = "0.3.34"
pest = "2.9"
pest_derive = "2.9"
getrandom = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
