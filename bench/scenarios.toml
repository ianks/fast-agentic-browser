# Scenario suite. Each scenario has scripted steps (what an LLM would send to
# `act`/`run`/`extract`) and a goal for planner mode. Checks use the events the
# fixture page posts to /__record.

[[scenario]]
name = "login"
fixture = "login.html"
tags = ["form", "nav", "core"]
goal = "Sign in as alice with the password hunter2."
paraphrases = [
  "log in as alice, password hunter2",
  "Hi! Could you sign me in? My username is alice and my password is hunter2. Thanks!",
  "Using the password hunter2, sign in as alice.",
  "Log into the account alice with hunter2 as the password.",
]
steps = [{ act = 'log in as "alice" with password "hunter2"' }]
expect_records = [{ event = "login", user = "alice", pass = "hunter2" }]
allow_records = []

[[scenario]]
name = "login_noquote"
fixture = "login.html"
tags = ["form", "nav", "spans"]
goal = "Sign in as bob with password s3cret-pw, and keep me signed in."
paraphrases = [
  "log in as bob, pw s3cret-pw, keep me signed in",
  "Hey, can you sign me in as bob? The password is s3cret-pw. Oh, and please make sure I stay signed in afterwards so I don't have to log in again.",
  "Keep me signed in: sign in as bob using the password s3cret-pw.",
  "Log on as bob with the password s3cret-pw and choose to stay logged in.",
]
steps = [{ act = "sign in as bob with password s3cret-pw and keep me signed in" }]
expect_records = [{ event = "login", user = "bob", pass = "s3cret-pw", remember = "on" }]
allow_records = [{ event = "login", user = "bob", pass = "s3cret-pw" }]

[[scenario]]
