# Held-out benchmark v2 (blind). Fixtures live in fixtures/heldout2/ (served at /heldout2/<app>.html).
# 40 scenarios over 20 apps, 2 per app. Tags: "form" (multi-step forms/wizards), "navigation" (unfamiliar
# hierarchies), "data" (aggregation/compare/top-N/near-duplicates), "failure" (session expiry, validation,
# flaky save, taken name, destructive confirm, interstitial), "restraint" (sold out/unavailable or "only X").
# Grading: every expect_record must subset-match a posted record; every posted record must match
# expect_records or allow_records; nothing may match forbid_records; expect_answer is a substring check.
# Every paraphrase keeps the goal's literal values identical.

