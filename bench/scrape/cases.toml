prompt = "list all issues labeled bug with their number, title and author"

[[case]]
name = "news_sections"
set = "heldout"
url = "fixture:scrape/news/index.html"
key = "section+headline"
prompt = "For each section, get the first 5 articles: section name, headline, and the byline and publish date from the article page."

[[case]]
name = "deals_under50"
set = "heldout"
url = "fixture:scrape/deals/1.html"
