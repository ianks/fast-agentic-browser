# ---- scale ----

[[case]]
name = "bigcat_all"
set = "scale"
url = "fixture:scrape/bigcat/p1.html"
key = "name"
prompt = "Scrape the whole catalog: name, price, and the manufacturer and weight from each product's page."

[[case]]
