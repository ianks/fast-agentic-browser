    if (t.closest('#wiz-next')) {
      collect();
      if (wiz.step === 0) { const m = basicErrors(wiz); if (m) { wizErr(m); return true; } }
      if (wiz.step < 2) { wiz.err = ''; wiz.step++; render(); return true; }
      const w = wiz; const m = basicErrors(w);
      if (m) { wizErr(m); return true; }
      if (!norm(w.description)) { wizErr('Add a description before publishing.'); return true; }
      if (!w.audio) { wizErr('Choose an audio file before publishing.'); return true; }
      let status = w.status === 'published' ? 'published' : w.mode === 'schedule' ? 'scheduled' : 'published';
      if (status === 'scheduled' && (!w.date || w.date < '2026-09-24')) { wizErr('Choose a publish date from today onwards.'); return true; }
      wizErr('');
      const b = t.closest('#wiz-next'); b.disabled = true; b.textContent = status === 'scheduled' ? 'Scheduling…' : 'Publishing…';
      await sleep(900);
      await saveEpisode(status);
      const show = w.show; wiz = null; epFilter = 'all';
      location.hash = `#/${show}/episodes`;
      toast(status === 'scheduled' ? 'Episode scheduled.' : w.status === 'published' ? 'Episode updated.' : 'Episode published.');
      return true;
    }
    return false;
  }

  // ---------------------------------------------------------------- analytics / distribution / monetization / website
  function analytics(s) {
    crumbs([s.name, 'Analytics']);
    const eps = EP.filter((e) => e.show === s.id && e.status === 'published').sort((a, b) => b.dl - a.dl);
    const days = Array.from({ length: 30 }, (_, i) => 120 + 80 * Math.sin(i * 0.8 + s.season) + (i % 7 === 1 ? 160 : 0) + s.followers / 200);
    const mx = Math.max(...days);
    return `<h1>Analytics</h1><div class="muted">${esc(s.name)} · last 30 days</div>
      <div class="card" style="margin-top:14px"><h2>Downloads per day</h2><div class="bars">${days.map((d) => `<i style="height:${((d / mx) * 100).toFixed(1)}%"></i>`).join('')}</div><div class="muted" style="display:flex;justify-content:space-between"><span>25 Aug</span><span>23 Sep</span></div></div>
      <div class="grid2"><div class="card"><h2>Top episodes</h2><table class="t"><thead><tr><th>Episode</th><th>Downloads</th></tr></thead><tbody>${eps.slice(0, 5).map((e) => `<tr><td>${esc(e.title)}</td><td>${group(e.dl)}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h2>Listening apps</h2>${[['Apple Podcasts', 41], ['Spotify', 33], ['Pocket Casts', 9], ['Overcast', 7], ['Other', 10]].map(([a, p]) => `<div class="hbar"><span>${a}</span><span class="tr"><i style="width:${p * 2}%"></i></span><span>${p}%</span></div>`).join('')}</div></div>`;
  }
  function distribution(s) {
    crumbs([s.name, 'Distribution']);
    return `<h1>Distribution</h1><div class="muted">Where ${esc(s.name)} is listed</div>
      <div class="card" style="margin-top:14px"><div class="fld"><label for="rss">RSS feed</label><input type="text" id="rss" readonly value="https://feeds.waypost.fm/${s.id}.xml"></div><button type="button" class="btn" data-noop="RSS feed URL copied.">Copy RSS URL</button></div>
      <div class="card"><h2>Directories</h2>${DIRS.map((d) => `<div class="swrow"><div><b>${d}</b><span class="muted">${dirState[s.id][d] ? 'Listed' : 'Not listed'}</span></div><button type="button" class="switch" role="switch" data-dir="${esc(d)}" aria-label="List on ${esc(d)}" aria-checked="${dirState[s.id][d]}"></button></div>`).join('')}</div>`;
  }
  function monetization(s) {
    crumbs([s.name, 'Monetization']);
    const m = mon[s.id];
    return `<h1>Monetization</h1><div class="muted">${esc(s.name)}</div>
      <div class="card" style="margin-top:14px"><div class="swrow"><div><b>Dynamic ad insertion</b><span class="muted">Waypost sells and inserts ads into your back catalogue (you keep 70%)</span></div><button type="button" class="switch" role="switch" id="mon-dai" aria-label="Dynamic ad insertion" aria-checked="${m.dai}"></button></div>
      <div class="swrow"><div><b>Listener support</b><span class="muted">Show a “Support the show” button in Waypost-powered apps</span></div><button type="button" class="switch" role="switch" id="mon-tips" aria-label="Listener support" aria-checked="${m.tips}"></button></div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button type="button" class="btn pri" id="mon-save">Save monetization settings</button></div></div>`;
  }
  function website(s) {
    crumbs([s.name, 'Website']);
    const w = site[s.id];
    return `<h1>Website</h1><div class="muted">${esc(s.name)} · https://${s.id}.waypost.fm</div>
      <div class="card" style="margin-top:14px"><div class="fld"><label for="web-theme">Theme</label><select id="web-theme">${['Harbour', 'Broadsheet', 'Minimal', 'Night shift'].map((x) => `<option ${x === w.theme ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="fld"><label for="web-domain">Custom domain (optional)</label><input type="text" id="web-domain" placeholder="www.example.com" value="${esc(w.domain)}"></div>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="web-tr" ${w.transcripts ? 'checked' : ''}> Show episode transcripts on the website</label>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button type="button" class="btn pri" id="web-save">Publish website changes</button></div></div>`;
  }

  // ---------------------------------------------------------------- settings
  const STABS = [['general', 'General'], ['listing', 'Listing'], ['artwork', 'Artwork'], ['website', 'Website'], ['advanced', 'Advanced']];
  const LTABS = [['categories', 'Categories'], ['ownership', 'Ownership'], ['language', 'Language & region']];
  function catSelect(id, val, withNone) {
    return `<select id="${id}">${withNone ? `<option value="" ${val ? '' : 'selected'}>None</option>` : ''}${CATEGORIES.map(([g, opts]) => `<optgroup label="${esc(g)}">${opts.map(([k, l]) => `<option value="${k}" ${k === val ? 'selected' : ''}>${esc(l)}</option>`).join('')}</optgroup>`).join('')}</select>`;
  }
  function settings(s, tab, sub) {
    tab = STABS.some(([k]) => k === tab) ? tab : 'general';
    let body = '';
    if (tab === 'general') {
      body = `<div class="card"><div class="fld"><label for="g-title">Show title</label><input type="text" id="g-title" value="${esc(s.name)}"></div><div class="fld"><label for="g-author">Author</label><input type="text" id="g-author" value="${esc(s.author)}"></div><div class="fld"><label for="g-desc">Show description</label><textarea id="g-desc" style="border-radius:9px">${esc(s.desc)}</textarea></div>
        <div class="fld"><span class="lbl" id="stype-lbl">Show type</span><div class="rcards" role="radiogroup" aria-labelledby="stype-lbl" style="grid-template-columns:repeat(2,1fr)"><label class="rc"><input type="radio" name="g-type" value="episodic" ${s.type === 'episodic' ? 'checked' : ''}><b>Episodic</b><small>Newest first. Episodes can be heard in any order.</small></label><label class="rc"><input type="radio" name="g-type" value="serial" ${s.type === 'serial' ? 'checked' : ''}><b>Serial</b><small>Oldest first. Episodes are meant to be heard in order.</small></label></div></div>
        <div style="display:flex;justify-content:flex-end"><button type="button" class="btn pri" id="save-general">Save changes</button></div></div>`;
    } else if (tab === 'listing') {
      sub = LTABS.some(([k]) => k === sub) ? sub : 'categories';
      let inner = '';
      if (sub === 'categories') inner = `<p class="muted">Categories help listeners find ${esc(s.name)} in Apple Podcasts and other apps. Apple uses the primary category for charts.</p>
        <div class="fld"><label for="cat-primary">Primary category</label>${catSelect('cat-primary', s.primary, false)}</div>
        <div class="fld"><label for="cat-secondary">Secondary category</label>${catSelect('cat-secondary', s.secondary, true)}</div>
        <div class="preview" id="cat-preview">Apple Podcasts: <b>${esc(catName(s.primary))}</b>${s.secondary ? ` · also in <b>${esc(catName(s.secondary))}</b>` : ''}</div>`;
      if (sub === 'ownership') inner = `<div class="fld"><label for="own-name">Owner name</label><input type="text" id="own-name" value="${esc(s.ownerName)}"></div><div class="fld"><label for="own-email">Owner email</label><input type="email" id="own-email" value="${esc(s.ownerEmail)}"><div class="hint">Apple and Spotify use this address to verify ownership. It appears in your public RSS feed.</div></div><div class="fld"><label for="own-copy">Copyright</label><input type="text" id="own-copy" value="${esc(s.copyright)}"></div>`;
      if (sub === 'language') inner = `<div class="fld"><label for="lang">Language</label><select id="lang">${['English (UK)', 'English (US)', 'Irish', 'Welsh', 'Scottish Gaelic', 'Spanish', 'Portuguese'].map((x) => `<option ${x === s.language ? 'selected' : ''}>${x}</option>`).join('')}</select></div><div class="fld"><label for="country">Country</label><select id="country">${['United Kingdom', 'Ireland', 'United States', 'Canada', 'Australia'].map((x) => `<option ${x === s.country ? 'selected' : ''}>${x}</option>`).join('')}</select></div>`;
      body = `<div class="subtabs" role="tablist" aria-label="Listing">${LTABS.map(([k, l]) => `<a role="tab" aria-selected="${k === sub}" href="#/${s.id}/settings/listing/${k}">${l}</a>`).join('')}</div><div class="card">${inner}<div style="display:flex;justify-content:flex-end;margin-top:6px"><button type="button" class="btn pri" id="save-listing" data-sub="${sub}">Save listing</button></div></div>`;
    } else if (tab === 'artwork') {
      body = `<div class="card"><div style="display:flex;gap:18px;align-items:center"><span class="sq" style="width:140px;height:140px;font-size:34px;background:${s.color}">${s.initials}</span><div><b>Show artwork</b><p class="muted">3000 × 3000 px JPEG or PNG. Replacing artwork is unavailable while uploads are paused for maintenance.</p><button type="button" class="btn" disabled>Replace artwork</button></div></div></div>`;
    } else if (tab === 'website') {
      body = `<div class="card"><p>Your show website is at <b>https://${s.id}.waypost.fm</b>.</p><a class="btn" href="#/${s.id}/website">Manage website</a></div>`;
    } else {
      body = `<div class="card"><div class="fld"><label for="adv-rss">RSS feed URL</label><input type="text" id="adv-rss" readonly value="https://feeds.waypost.fm/${s.id}.xml"></div><div class="swrow"><div><b>Hide from Waypost search</b><span class="muted">Your show won’t appear in Waypost’s own directory</span></div><button type="button" class="switch" role="switch" id="adv-hide" aria-label="Hide from Waypost search" aria-checked="false"></button></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button type="button" class="btn pri" id="save-advanced">Save advanced settings</button></div></div>
        <div class="card danger-zone"><h2 style="color:var(--red)">Danger zone</h2><div class="swrow"><div><b>Redirect this feed</b><span class="muted">Move the show to another host</span></div><button type="button" class="btn" disabled>Redirect…</button></div><div class="swrow" style="border:0"><div><b>Delete show</b><span class="muted">Removes the show, its episodes and its analytics</span></div><button type="button" class="btn danger" id="del-show">Delete show…</button></div></div>`;
    }
    crumbs([s.name, 'Settings', STABS.find(([k]) => k === tab)[1]].concat(tab === 'listing' ? [LTABS.find(([k]) => k === sub)[1]] : []));
    return `<h1>Settings</h1><div class="muted">${esc(s.name)}</div><div class="stabs" role="tablist" aria-label="Settings">${STABS.map(([k, l]) => `<a role="tab" aria-selected="${k === tab}" href="#/${s.id}/settings/${k}${k === 'listing' ? '/categories' : ''}">${l}</a>`).join('')}</div>${body}`;
  }
  function account(tab) {
    const pages = { billing: ['Plan & billing', '<div class="card"><b>Waypost Pro</b> · £19/month · renews 3 Oct 2026<p class="muted">Includes 3 shows, unlimited uploads, advanced analytics.</p><button type="button" class="btn" data-noop="Plan changes are handled by the account owner.">Change plan</button></div>'], team: ['Team', '<div class="card"><table class="t"><thead><tr><th>Name</th><th>Role</th></tr></thead><tbody><tr><td>Imogen Tarrant-Lowe</td><td>Owner</td></tr><tr><td>Cormac Ó Dálaigh</td><td>Editor · Low Tide Stories</td></tr><tr><td>Aditya Raman</td><td>Editor · The Margin Notes</td></tr></tbody></table></div>'], help: ['Help centre', '<div class="card"><details open><summary><b>What’s the difference between Save draft and Save and publish?</b></summary><p>Drafts are private and can be edited any time. Publishing sends the episode to every directory.</p></details><details><summary><b>How do categories work?</b></summary><p>Choose a primary category (used for charts) and an optional secondary category.</p></details></div>'] };
    const p = pages[tab] || pages.help;
    crumbs(['Account', p[0]]);
    return `<h1>${p[0]}</h1>${p[1]}`;
  }

  function render() {
    const r = route();
    if (r[0] === 'account') { q('#main').innerHTML = account(r[1]); renderSide(); return; }
    const s = SH[curShow()];
    if (!SH[r[0]] || !r[1]) { history.replaceState(null, '', `#/${s.id}/dashboard`); }
    renderSide();
    const [, sec, a, b] = route();
    let h;
    if (sec === 'dashboard') h = dashboard(s);
    else if (sec === 'episodes' && a) h = wizardPage(s, a);
    else if (sec === 'episodes') h = episodes(s);
    else if (sec === 'analytics') h = analytics(s);
    else if (sec === 'distribution') h = distribution(s);
    else if (sec === 'monetization') h = monetization(s);
    else if (sec === 'website') h = website(s);
    else if (sec === 'settings') h = settings(s, a, b);
    else h = `<h1>Page not found</h1><p><a href="#/${s.id}/dashboard">Go to the dashboard</a></p>`;
    q('#main').innerHTML = h;
  }
  window.addEventListener('hashchange', () => { const [, sec, a] = route(); if (!(sec === 'episodes' && a)) wiz = null; render(); window.scrollTo(0, 0); });

  q('#main').addEventListener('input', (e) => { if (e.target.id === 'ep-title') q('#title-count').textContent = `${e.target.value.length}/150`; });
  q('#main').addEventListener('change', (e) => {
    const t = e.target;
    if (t.name === 'ep-type') { const w = q('#epnum-wrap'); if (w) w.hidden = t.value === 'trailer'; }
    if (t.name === 'ep-mode') q('#sched-wrap').hidden = t.value !== 'schedule';
    if (t.id === 'cat-primary' || t.id === 'cat-secondary') { const p = q('#cat-primary').value, s2 = q('#cat-secondary').value; q('#cat-preview').innerHTML = `Apple Podcasts: <b>${esc(catName(p))}</b>${s2 ? ` · also in <b>${esc(catName(s2))}</b>` : ''}`; }
  });
  q('#main').addEventListener('click', async (e) => {
    const t = e.target;
    if (q('#wiz-body') && t.closest('#wiz-body') && await onWizard(e)) return;
    const s = SH[curShow()];
    const ef = t.closest('[data-epf]'); if (ef) { epFilter = ef.dataset.epf; render(); return; }
    const de = t.closest('[data-del-ep]');
    if (de) { const ep = EP.find((x) => x.id === de.dataset.delEp); confirmBox(`Delete the draft “${ep.title}”? This can’t be undone.`, 'Delete draft', async () => { await post({ event: 'episode_delete', show: ep.show, episode_id: ep.id, title: ep.title }); EP.splice(EP.indexOf(ep), 1); render(); toast('Draft deleted.'); }); return; }
    const noop = t.closest('[data-noop]'); if (noop) { toast(noop.dataset.noop); return; }
    const dir = t.closest('[data-dir]');
    if (dir) { const d = dir.dataset.dir, v = dir.getAttribute('aria-checked') !== 'true'; dir.disabled = true; await sleep(500); await post({ event: 'distribution_update', show: s.id, directory: d, listed: v ? 'yes' : 'no' }); dirState[s.id][d] = v; render(); toast(`${v ? 'Listed on' : 'Removed from'} ${d}.`); return; }
    const sw = t.closest('.switch'); if (sw && !sw.dataset.dir) { sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true')); return; }
    if (t.closest('#mon-save')) { const v = { dai: q('#mon-dai').getAttribute('aria-checked') === 'true', tips: q('#mon-tips').getAttribute('aria-checked') === 'true' }; await sleep(500); await post({ event: 'monetization_update', show: s.id, ad_insertion: v.dai ? 'on' : 'off', listener_support: v.tips ? 'on' : 'off' }); mon[s.id] = v; toast('Monetization settings saved.'); return; }
    if (t.closest('#web-save')) { const v = { theme: q('#web-theme').value, domain: norm(q('#web-domain').value), transcripts: q('#web-tr').checked }; await sleep(600); await post({ event: 'website_update', show: s.id, theme: v.theme, domain: v.domain, transcripts: v.transcripts ? 'on' : 'off' }); site[s.id] = v; toast('Website published.'); return; }
    if (t.closest('#save-general')) {
      const title = norm(q('#g-title').value), author = norm(q('#g-author').value), desc = norm(q('#g-desc').value), type = (q('input[name=g-type]:checked') || {}).value;
      if (!title) { toast('Your show needs a title.'); return; }
      await busy(t.closest('#save-general'), 600);
      await post({ event: 'show_settings_save', show: s.id, section: 'general', title, author, description: desc, show_type: type });
      Object.assign(s, { name: title, author, desc, type }); render(); toast('Settings saved.'); return;
    }
    const sl = t.closest('#save-listing');
    if (sl) {
      const sub = sl.dataset.sub;
      if (sub === 'categories') {
        const primary = q('#cat-primary').value, secondary = q('#cat-secondary').value;
        if (primary === secondary) { toast('Choose a secondary category that’s different from the primary one.'); return; }
        await busy(sl, 600);
        await post({ event: 'show_settings_save', show: s.id, section: 'categories', primary, secondary });
        Object.assign(s, { primary, secondary });
      } else if (sub === 'ownership') {
        const name = norm(q('#own-name').value), email = q('#own-email').value.trim().toLowerCase(), copyright = norm(q('#own-copy').value);
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Enter a valid owner email.'); return; }
        await busy(sl, 600);
        await post({ event: 'show_settings_save', show: s.id, section: 'ownership', owner_name: name, owner_email: email, copyright });
        Object.assign(s, { ownerName: name, ownerEmail: email, copyright });
      } else {
        const language = q('#lang').value, country = q('#country').value;
        await busy(sl, 600);
        await post({ event: 'show_settings_save', show: s.id, section: 'language', language, country });
        Object.assign(s, { language, country });
      }
      render(); toast('Listing saved.'); return;
    }
    if (t.closest('#save-advanced')) { const v = q('#adv-hide').getAttribute('aria-checked') === 'true'; await busy(t.closest('#save-advanced'), 500); await post({ event: 'show_settings_save', show: s.id, section: 'advanced', hide_from_search: v ? 'yes' : 'no' }); toast('Advanced settings saved.'); return; }
    if (t.closest('#del-show')) {
      const d = modal(`<h3>Delete ${esc(s.name)}?</h3><p>This removes the show, all ${EP.filter((x) => x.show === s.id).length} episodes and their analytics. Type the show name to confirm.</p><div class="fld"><label for="del-confirm">Show name</label><input type="text" id="del-confirm"></div><div class="acts"><button type="button" class="btn" data-c>Cancel</button><button type="button" class="btn danger" data-ok>Delete show</button></div>`);
      d.querySelector('[data-c]').onclick = closeModal;
      d.querySelector('[data-ok]').onclick = async () => { if (norm(d.querySelector('#del-confirm').value) !== s.name) { toast('The name doesn’t match.'); return; } await sleep(600); await post({ event: 'show_delete', show: s.id }); closeModal(); toast('Show scheduled for deletion.'); };
      return;
    }
  });
  async function busy(btn, ms) { btn.disabled = true; const l = btn.textContent; btn.textContent = 'Saving…'; await sleep(ms); btn.disabled = false; btn.textContent = l; }

  function modal(html) { q('#modal-root').innerHTML = `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`; return q('#modal-root .dialog'); }
  function closeModal() { q('#modal-root').innerHTML = ''; }
  function confirmBox(msg, ok, fn) {
    const d = modal(`<h3>Are you sure?</h3><p>${esc(msg)}</p><div class="acts"><button type="button" class="btn" data-c>Cancel</button><button type="button" class="btn pri" data-ok>${esc(ok)}</button></div>`);
    d.querySelector('[data-c]').onclick = closeModal;
    d.querySelector('[data-ok]').onclick = async () => { d.querySelector('[data-ok]').disabled = true; await sleep(400); closeModal(); await fn(); };
  }

  if (!location.hash) history.replaceState(null, '', '#/kitchen-table-physics/dashboard');
  render();
})();
</script>
</body>
</html>
