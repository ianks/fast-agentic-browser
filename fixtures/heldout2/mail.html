<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox · Postbox</title>
<script src="../common.js"></script>
<style>
  :root { --blue: #2f6fed; --blue-d: #1f55c4; --blue-l: #e8f0fe; --ink: #1f2430; --muted: #6b7280; --line: #e6e8ee; --side: #f6f8fc; --sel: #c2dbff; --unread: #fff; --read: #f7f9fc; --bad: #c5221f; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 "Helvetica Neue", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--side); }
  a { color: var(--blue-d); text-decoration: none; }
  header.top { height: 62px; display: flex; align-items: center; gap: 18px; padding: 0 16px 0 20px; }
  .logo { display: flex; align-items: center; gap: 9px; width: 222px; font-size: 21px; color: #3c4150; font-weight: 500; letter-spacing: -.2px; }
  .sform { flex: 1; max-width: 720px; display: flex; align-items: center; background: #eaf1fb; border-radius: 24px; padding: 0 6px; height: 46px; }
  .sform:focus-within { background: #fff; box-shadow: 0 1px 3px rgba(60,64,67,.3); }
  .sform input { flex: 1; border: 0; background: none; font: inherit; font-size: 15px; padding: 10px 6px; outline: none; }
  .sform button { background: none; border: 0; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 16px; color: #444; }
  .sform button:hover { background: rgba(0,0,0,.06); }
  .hicons { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .ib { background: none; border: 0; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; color: #444; }
  .ib:hover { background: rgba(0,0,0,.06); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #7b61c9; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; margin-left: 6px; border: 0; cursor: pointer; }
  .shell { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 62px); }
  nav.side { padding: 4px 8px 20px 0; }
  .compose { margin: 6px 0 14px 8px; display: inline-flex; align-items: center; gap: 12px; background: #c2e7ff; color: #001d35; border: 0; border-radius: 16px; padding: 16px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  .compose:hover { box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .fl { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 12px 0 22px; border-radius: 0 16px 16px 0; color: #202124; font-size: 14px; }
  .fl:hover { background: #e9ecf1; }
  .fl.on { background: #d3e3fd; font-weight: 700; color: #041e49; }
  .fl .n { margin-left: auto; font-size: 12.5px; font-weight: 700; }
  .fl .ic { width: 20px; text-align: center; }
  .sechd { display: flex; align-items: center; padding: 14px 12px 4px 22px; font-weight: 600; color: #444; }
  .sechd button { margin-left: auto; background: none; border: 0; font-size: 18px; cursor: pointer; color: #555; border-radius: 50%; width: 28px; height: 28px; }
  .ftree, .ftree ul { list-style: none; margin: 0; padding: 0; }
  .ftree ul { padding-left: 14px; }
  .ftree .fr { display: flex; align-items: center; }
  .ftree .exp { width: 22px; height: 26px; background: none; border: 0; cursor: pointer; color: #5f6368; font-size: 11px; margin-left: 4px; flex: none; }
  .ftree .nexp { width: 22px; margin-left: 4px; flex: none; }
  .ftree .fl { flex: 1; padding-left: 4px; height: 28px; }
  .ftree .fl .ic { width: 16px; color: #8a8f99; }
  .pane { background: #fff; border-radius: 16px; margin: 0 16px 16px 0; min-height: calc(100vh - 80px); overflow: hidden; }
  .ltool { display: flex; align-items: center; gap: 4px; padding: 8px 14px; border-bottom: 1px solid var(--line); min-height: 48px; position: sticky; top: 0; background: #fff; z-index: 3; }
  .tb { background: none; border: 0; height: 34px; min-width: 34px; padding: 0 9px; border-radius: 17px; cursor: pointer; font: inherit; font-size: 13.5px; color: #3c4043; display: inline-flex; align-items: center; gap: 5px; }
  .tb:hover { background: rgba(0,0,0,.06); }
  .tb:disabled { opacity: .4; cursor: default; }
  .tsep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
  .pgtxt { margin-left: auto; font-size: 12.5px; color: var(--muted); padding: 0 8px; }
  .lhead { padding: 10px 18px 4px; font-size: 13px; color: var(--muted); }
  .mrow { display: flex; align-items: center; gap: 6px; padding: 0 14px 0 12px; height: 40px; border-bottom: 1px solid #f1f3f4; background: var(--read); position: relative; }
  .mrow.unread { background: var(--unread); }
  .mrow.unread .from, .mrow.unread .subj b, .mrow.unread .date { font-weight: 800; color: #111; }
  .mrow:hover { box-shadow: inset 1px 0 0 #dadce0, inset -1px 0 0 #dadce0, 0 1px 2px rgba(60,64,67,.3); z-index: 1; }
  .mrow.selected { background: var(--sel); }
  .mrow input.sel { width: 16px; height: 16px; margin: 0 4px; cursor: pointer; }
  .star { background: none; border: 0; font-size: 17px; color: #b0b4ba; cursor: pointer; width: 28px; }
  .star.on { color: #f4b400; }
  .mlink { flex: 1; display: flex; align-items: center; gap: 12px; color: #202124; min-width: 0; height: 100%; }
  .mlink .from { width: 190px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .mlink .subj { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .mlink .subj b { font-weight: 500; }
  .mlink .snip { color: #5f6368; }
  .mlink .date { width: 64px; text-align: right; flex: none; font-size: 12.5px; color: #3c4043; }
  .fchip { display: inline-block; background: #e8eaed; color: #3c4043; border-radius: 4px; padding: 0 6px; font-size: 11.5px; margin-right: 6px; font-weight: 500; vertical-align: 1px; }
  .hov { visibility: hidden; position: absolute; right: 12px; top: 3px; display: flex; gap: 2px; background: inherit; padding-left: 8px; }
  .mrow:hover .hov, .mrow:focus-within .hov { visibility: visible; }
  .mrow:hover .date, .mrow:focus-within .date { visibility: hidden; }
  .hov button { background: none; border: 0; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 15px; }
  .hov button:hover { background: rgba(0,0,0,.07); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .rtool { display: flex; align-items: center; gap: 2px; padding: 8px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 3; }
  .reader { padding: 18px 28px 30px 70px; }
  .reader h1 { font-size: 22px; font-weight: 400; margin: 6px 0 18px; color: #1f1f1f; }
  .sender { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
  .sender .av { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; margin-left: -54px; flex: none; }
  .sender .av::before { content: attr(data-i); }
  .sender .who b { font-size: 14.5px; }
  .sender .when { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .mbody { font-size: 14.5px; line-height: 1.6; max-width: 760px; }
  .atts { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
  .att { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; min-width: 230px; }
  .att .pdf { background: #d93025; color: #fff; font-size: 10px; font-weight: 700; border-radius: 3px; padding: 2px 4px; }
  .rbar { display: flex; gap: 10px; margin-top: 26px; }
  .btn { font: inherit; padding: 8px 18px; border-radius: 18px; border: 1px solid #747775; background: #fff; cursor: pointer; color: #1f1f1f; font-weight: 500; }
  .btn:hover { background: #f4f6fb; }
  .btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.pri:hover { background: var(--blue-d); }
  .btn.sm { padding: 4px 12px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .pop { position: absolute; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(60,64,67,.28), 0 1px 3px rgba(60,64,67,.2); z-index: 30; width: 290px; padding: 8px 0; }
  .pop .ph { padding: 4px 14px 8px; font-size: 12.5px; color: var(--muted); }
  .pop input[type=search] { margin: 0 12px 6px; width: calc(100% - 24px); padding: 7px 9px; border: 1px solid #c7c9cf; border-radius: 6px; font: inherit; }
  .pop .body { max-height: 300px; overflow: auto; }
  .pop ul { list-style: none; margin: 0; padding: 0; }
  .pop ul ul { padding-left: 16px; }
  .pop .ti { display: flex; align-items: center; }
  .pop .exp { width: 26px; height: 30px; background: none; border: 0; cursor: pointer; color: #5f6368; font-size: 11px; margin-left: 6px; flex: none; }
  .pop .nexp { width: 26px; margin-left: 6px; flex: none; }
  .pop .mv, .pop .mi { flex: 1; text-align: left; background: none; border: 0; font: inherit; padding: 6px 12px 6px 4px; cursor: pointer; color: #202124; }
  .pop .mi { padding-left: 16px; display: block; width: 100%; }
  .pop .mv:hover, .pop .mi:hover { background: #f1f3f4; }
  .pop .foot { border-top: 1px solid var(--line); margin-top: 6px; padding: 6px 8px 0; display: flex; justify-content: space-between; }
  .pop label { display: flex; gap: 8px; align-items: center; padding: 5px 14px; cursor: pointer; }
  .toast { position: fixed; left: 24px; bottom: 24px; background: #323232; color: #fff; padding: 12px 18px; border-radius: 6px; z-index: 60; font-size: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
  .qs { position: fixed; top: 62px; right: 12px; width: 300px; background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.2); padding: 16px 18px; z-index: 25; }
  .qs fieldset { border: 0; padding: 0; margin: 14px 0 0; }
  .qs legend { font-weight: 700; margin-bottom: 6px; font-size: 13px; }
  .qs label { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .settings { padding: 18px 26px 40px; }
  .settings h1 { font-size: 22px; font-weight: 400; margin: 0 0 12px; }
  .stabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .stabs a { padding: 10px 14px; color: #3c4043; border-bottom: 3px solid transparent; font-size: 13.5px; }
  .stabs a[aria-selected=true] { color: var(--blue-d); border-bottom-color: var(--blue); font-weight: 700; }
  .srow { display: grid; grid-template-columns: 240px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid #f1f3f4; }
  .srow > .k { font-weight: 700; color: #3c4043; }
  .srow label { display: flex; gap: 8px; align-items: center; margin: 3px 0; font-weight: 400; }
  input[type=text], input[type=email], select, textarea { font: inherit; padding: 7px 9px; border: 1px solid #c7c9cf; border-radius: 6px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #aecbfa; border-color: var(--blue); }
  .ftable { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .ftable td { padding: 10px 8px; border-bottom: 1px solid #f1f3f4; vertical-align: top; }
  .ftable .lk { color: var(--blue-d); background: none; border: 0; font: inherit; cursor: pointer; padding: 0 4px; }
  .fbox { border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px rgba(60,64,67,.15); padding: 16px 20px; max-width: 620px; margin: 10px 0 20px; background: #fff; }
  .fbox .fg { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 8px 12px; }
  .fbox .fg label { font-weight: 400; color: #3c4043; }
  .fbox .fg input[type=text] { width: 100%; }
  .fbox .acts label { display: flex; gap: 9px; align-items: center; padding: 4px 0; }
  .fbox .acts select { margin-left: 4px; }
  .fbox .back { background: none; border: 0; color: var(--blue-d); cursor: pointer; font: inherit; padding: 0; margin-bottom: 10px; }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .overlay { position: fixed; inset: 0; background: rgba(32,33,36,.5); display: flex; align-items: flex-start; justify-content: center; padding-top: 110px; z-index: 50; }
  .dialog { background: #fff; border-radius: 12px; width: 460px; padding: 20px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  .dialog h2 { font-size: 18px; font-weight: 500; margin: 0 0 12px; }
  .dialog .df { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .cmp { position: fixed; right: 24px; bottom: 0; width: 500px; background: #fff; border-radius: 12px 12px 0 0; box-shadow: 0 8px 24px rgba(0,0,0,.3); z-index: 45; }
  .cmp .ch { background: #f2f6fc; padding: 10px 14px; border-radius: 12px 12px 0 0; display: flex; font-weight: 600; }
  .cmp .ch button { margin-left: auto; background: none; border: 0; cursor: pointer; }
  .cmp input { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 9px 14px; }
  .cmp textarea { width: 100%; border: 0; min-height: 200px; padding: 10px 14px; resize: none; }
  .cmp .cf { padding: 10px 14px; display: flex; gap: 10px; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .compact .mrow { height: 32px; }
  .comfy .mrow { height: 48px; }
  .sfoot { padding: 12px 20px; font-size: 12px; color: var(--muted); display: flex; gap: 16px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header class="top">
  <div class="logo"><svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true"><rect x="1" y="2" width="28" height="20" rx="4" fill="#2f6fed"/><path d="M3 5 L15 14 L27 5" stroke="#fff" stroke-width="2.4" fill="none"/></svg>Postbox</div>
  <form class="sform" id="sform" role="search"><button type="submit" aria-label="Search">🔍</button><input type="search" id="sq" placeholder="Search mail" aria-label="Search mail" autocomplete="off"><button type="button" id="sclear" aria-label="Clear search">✕</button></form>
  <div class="hicons">
    <button type="button" class="ib" aria-label="Support" id="hsupport">?</button>
    <button type="button" class="ib" aria-label="Settings" id="hsettings">⚙</button>
    <button type="button" class="ib" aria-label="Apps" id="happs">⋮⋮</button>
    <button type="button" class="avatar" aria-label="Account: Maëlle Kerbrat" id="hacct">MK</button>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Mailboxes"></nav>
  <div class="pane" id="pane"></div>
</div>
<aside class="qs" id="qs" role="dialog" aria-label="Quick settings" hidden>
  <div style="display:flex;align-items:center"><b style="font-size:15px">Quick settings</b><button type="button" class="ib" id="qs-x" aria-label="Close quick settings" style="margin-left:auto">✕</button></div>
  <button type="button" class="btn" id="qs-all" style="width:100%;margin-top:10px">See all settings</button>
  <fieldset><legend>Density</legend>
    <label><input type="radio" name="qs-density" value="default" checked> Default</label>
    <label><input type="radio" name="qs-density" value="comfortable"> Comfortable</label>
    <label><input type="radio" name="qs-density" value="compact"> Compact</label></fieldset>
  <fieldset><legend>Reading pane</legend>
    <label><input type="radio" name="qs-pane" value="none" checked> No split</label>
    <label><input type="radio" name="qs-pane" value="right"> Right of inbox</label>
    <label><input type="radio" name="qs-pane" value="below"> Below inbox</label></fieldset>
  <p class="muted" style="margin:14px 0 0">Storage: 4.2 GB of 30 GB used</p>
</aside>
<div id="pop-root"></div>
<div id="modal-root"></div>
<div id="cmp-root"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(() => {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s ?? '').normalize('NFC').trim().replace(/\s+/g, ' ');
  const fold = (s) => norm(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const post = (o) => rec(o).catch(() => {});
  const toast = (m) => { const t = q('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 4500); };
  const TODAY = '2026-09-24';
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const dow = (d) => { const [y, m, dd] = d.slice(0, 10).split('-').map(Number); return DOW[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()]; };
  const listDate = (d) => (d.slice(0, 10) === TODAY ? d.slice(11, 16) : d.slice(0, 4) === '2026' ? `${+d.slice(8, 10)} ${MON[+d.slice(5, 7) - 1]}` : `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}`);
  const longDate = (d) => `${dow(d)} ${+d.slice(8, 10)} ${MON[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}, ${d.slice(11, 16)}`;

  const SYS = [['inbox', 'Inbox', '📥'], ['starred', 'Starred', '☆'], ['snoozed', 'Snoozed', '⏰'], ['sent', 'Sent', '➤'], ['drafts', 'Drafts', '📝'], ['archive', 'Archive', '🗄'], ['spam', 'Spam', '⚠'], ['trash', 'Trash', '🗑']];
  const FOLDERS = [
    { path: 'clients', name: 'Clients', kids: [
      { path: 'clients/benelux', name: 'Benelux' },
      { path: 'clients/iberia', name: 'Iberia', kids: [{ path: 'clients/iberia/2025', name: '2025' }, { path: 'clients/iberia/2026', name: '2026' }] },
      { path: 'clients/nordics', name: 'Nordics', kids: [{ path: 'clients/nordics/2025', name: '2025' }, { path: 'clients/nordics/2026', name: '2026' }] },
    ] },
    { path: 'finance', name: 'Finance', kids: [{ path: 'finance/receipts', name: 'Receipts' }, { path: 'finance/taxes', name: 'Taxes' }, { path: 'finance/utilities', name: 'Utilities' }] },
    { path: 'press', name: 'Press' }, { path: 'travel', name: 'Travel' }, { path: 'newsletters', name: 'Newsletters' },
  ];
  const flat = []; (function walk(list, depth, prefix) { for (const f of list) { const label = prefix ? prefix + ' / ' + f.name : f.name; flat.push({ path: f.path, name: f.name, label, depth, kids: !!f.kids }); if (f.kids) walk(f.kids, depth + 1, label); } })(FOLDERS, 0, '');
  const folderLabel = (p) => { const s = SYS.find((x) => x[0] === p); if (s) return s[1]; const f = flat.find((x) => x.path === p); return f ? f.label : p; };

  // ------------------------------------------------------------------ messages
  const P = (...xs) => xs.join('\n\n');
  const M = [
    ['M-3431', 'inbox', 'Inês Carvalho', 'ines@lumarte.pt', '2026-09-24 08:52', 'Contract countersigned – Lumarte x Ardent', P('Olá Maëlle,', 'Attached is the countersigned contract for the Lumarte showroom fit-out. Payment schedule as agreed: 40% on signature, 40% at install, 20% at handover.', 'Could you send the first invoice to finance@lumarte.pt with our PO number LUM-2026-114?', 'Beijinhos,\nInês'), { u: 1, at: ['Lumarte_Ardent_contract_signed.pdf'] }],
    ['M-3430', 'inbox', 'Quay Metrics Billing', 'billing@quaymetrics.io', '2026-09-24 08:10', 'Your September invoice is ready (INV-2026-0918)', P('Hi Ardent Studio,', 'Your invoice for September 2026 is ready. Amount due: €249.00 (Studio plan, 5 seats). It will be charged to the card ending 4417 on 1 October 2026.', 'You can download the PDF from Billing › Invoices in your Quay Metrics workspace.', '— Quay Metrics'), { u: 1 }],
    ['M-3429', 'inbox', 'The Brief', 'digest@thebrief.news', '2026-09-24 07:31', 'Thursday: freight costs ease, the EU design act, and a very tall chair', P('Good morning. Container rates fell for a sixth week, Brussels publishes the final text of the design act, and a Milanese studio built a 4-metre chair for no clear reason.', 'Read the full edition in your browser.'), { u: 1 }],
    ['M-3427', 'inbox', 'Joost van Dijk', 'joost@vandijkevents.nl', '2026-09-23 18:44', 'Amsterdam launch – run of show v4', P('Hi Maëlle,', 'Run of show v4 attached. Main change: doors now at 18:30, speeches moved to 19:15 so the DJ can start earlier.', 'Can you confirm the stage dimensions (6 × 4 m?) by Friday?', 'Groetjes,\nJoost'), { u: 1, at: ['Run_of_show_v4.pdf'] }],
    ['M-3426', 'inbox', 'Aurélie Fontaine', 'aurelie@ardentstudio.eu', '2026-09-23 16:20', 'Moodboard feedback before Friday', P('Hey! Left comments on the Q4 pitch moodboard in Sketchpad. Mostly about the palette — I think the terracotta fights the oak.', 'Can we do 15 minutes tomorrow afternoon?', 'A.'), {}],

      return;
    }
    const EV = { archive: ['message_archive', 'archive', 'archived'], spam: ['message_spam', 'spam', 'reported as spam'], delete: ['message_delete', 'trash', 'moved to Trash'], read: ['message_mark_read', null, 'marked as read'], unread: ['message_mark_unread', null, 'marked as unread'] }[act];
    if (!EV) return;
    for (const id of ids) {
      const m = byId(id);
      await post({ event: EV[0], message_id: m.id, folder: m.f });
      if (EV[1]) m.f = EV[1]; if (act === 'read') m.u = false; if (act === 'unread') m.u = true;
    }
    st.sel.clear();
    toast(`${ids.length > 1 ? ids.length + ' conversations' : 'Conversation'} ${EV[2]}.`);
    if (parts()[0] === 'msg' && act !== 'read') location.hash = '#' + st.lastList; else render();
  }

  // ------------------------------------------------------------------ dialogs / compose
  function dialog(html) { q('#modal-root').innerHTML = `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`; qa('#modal-root [data-close]').forEach((b) => b.addEventListener('click', () => (q('#modal-root').innerHTML = ''))); return q('#modal-root .dialog'); }
  function closeDialog() { q('#modal-root').innerHTML = ''; }
  function compose(pre = {}) {
    q('#cmp-root').innerHTML = `<div class="cmp" role="dialog" aria-label="New message"><div class="ch">${esc(pre.title || 'New message')}<button type="button" id="cmp-x" aria-label="Save and close">✕</button></div>
      <input type="text" id="cmp-to" placeholder="To" aria-label="To" value="${esc(pre.to || '')}"><input type="text" id="cmp-subj" placeholder="Subject" aria-label="Subject" value="${esc(pre.subject || '')}"><textarea id="cmp-body" aria-label="Message body">${esc(pre.body || '')}</textarea>
      <div class="cf"><button type="button" class="btn pri" id="cmp-send">Send</button><button type="button" class="btn" id="cmp-discard" aria-label="Discard draft">🗑 Discard</button></div></div>`;
    q('#cmp-x').addEventListener('click', () => { q('#cmp-root').innerHTML = ''; toast('Draft saved.'); });
    q('#cmp-discard').addEventListener('click', () => { q('#cmp-root').innerHTML = ''; toast('Draft discarded.'); });
    q('#cmp-send').addEventListener('click', async (e) => {
      const to = norm(q('#cmp-to').value);
      if (!/[\w.+-]+@[\w-]+\.[\w.-]+/.test(to)) { toast('Please specify at least one recipient.'); return; }
      e.currentTarget.disabled = true; await sleep(600);
      await post({ event: 'message_send', to: to.toLowerCase(), subject: norm(q('#cmp-subj').value) });
      q('#cmp-root').innerHTML = ''; toast('Message sent.');
    });
  }

  // ------------------------------------------------------------------ filters
  function newFbox(c = {}, a = {}, editId = null) { st.fbox = { step: 1, editId, c: Object.assign({ from: '', to: '', subject: '', has: '', not: '', attach: false }, c), a: Object.assign({ skip: false, read: false, star: false, move: false, folder: '', del: false, nospam: false, important: false, apply: true }, a) }; }
  function readCrit() { const f = st.fbox; f.c = { from: q('#fc-from').value, to: q('#fc-to').value, subject: q('#fc-subject').value, has: q('#fc-has').value, not: q('#fc-not').value, attach: q('#fc-attach').checked }; }
  function readActs() {
    const f = st.fbox; const ap = q('#fa-apply');
    f.a = { skip: q('#fa-skip').checked, read: q('#fa-read').checked, star: q('#fa-star').checked, move: q('#fa-move').checked, folder: q('#fa-folder').value, del: q('#fa-del').checked, nospam: q('#fa-nospam').checked, important: q('#fa-imp').checked, apply: ap ? ap.checked : false, hasApply: !!ap };
  }
  async function createFilter() {
    readActs();
    const f = st.fbox; const a = f.a; const e = q('#fa-err');
    const fail = (m) => { e.textContent = m; e.hidden = false; };
    if (a.move && !a.folder) return fail('Choose a folder to move matching messages to.');
    if (!a.skip && !a.read && !a.star && !a.move && !a.del && !a.nospam && !a.important) return fail('Select at least one action for this filter.');
    if (st.busy) return; st.busy = true;
    const b = q('#fa-create'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Saving…';
    await sleep(600);
    const yn = (x) => (x ? 'yes' : 'no');
    const c = f.c;
    await post({
      event: f.editId ? 'filter_update' : 'filter_create', ...(f.editId ? { filter_id: f.editId } : {}),
      from: norm(c.from).toLowerCase(), to: norm(c.to).toLowerCase(), subject: norm(c.subject), has_words: norm(c.has), not_words: norm(c.not), has_attachment: yn(c.attach),
      skip_inbox: yn(a.skip), mark_read: yn(a.read), star: yn(a.star), folder: a.move ? a.folder : '', forward_to: '', delete: yn(a.del), never_spam: yn(a.nospam), important: yn(a.important), apply_existing: yn(a.apply && a.hasApply),
    });
    const crit = {}; for (const k of ['from', 'to', 'subject', 'has', 'not']) if (norm(c[k])) crit[k] = norm(c[k]); if (c.attach) crit.attach = true;
    if (f.editId) { const ex = FILTERS.find((x) => x.id === f.editId); ex.crit = crit; ex.acts = { ...a }; }
    else FILTERS.push({ id: 'F-' + (FILTERS.length + 1), crit, acts: { ...a } });
    if (a.apply && a.hasApply) {
      for (const m of M) {
        if (!filterable(m) || !critMatch(c, m)) continue;
        if (a.read) m.u = false; if (a.star) m.st = true; if (a.move && a.folder) m.f = a.folder; else if (a.skip && m.f === 'inbox') m.f = 'archive'; if (a.del) m.f = 'trash';
      }
    }
    st.busy = false; st.fbox = null; render();
    toast(f.editId ? 'Your filter was updated.' : 'Your filter was created.');
  }

  // ------------------------------------------------------------------ events
  q('#sform').addEventListener('submit', (e) => { e.preventDefault(); const v = norm(q('#sq').value); if (v) location.hash = '#/search/' + encodeURIComponent(v); });
  q('#sclear').addEventListener('click', () => { q('#sq').value = ''; if (parts()[0] === 'search') location.hash = '#/inbox'; });
  q('#hsettings').addEventListener('click', () => { q('#qs').hidden = !q('#qs').hidden; });
  q('#qs-x').addEventListener('click', () => { q('#qs').hidden = true; });
  q('#qs-all').addEventListener('click', () => { q('#qs').hidden = true; location.hash = '#/settings/general'; });
  q('#hsupport').addEventListener('click', () => toast('Help: support.postbox.eu · Keyboard shortcuts: press ?'));
  q('#happs').addEventListener('click', () => toast('Postbox apps: Calendar, Contacts, Drive (coming soon).'));
  q('#hacct').addEventListener('click', () => toast('Signed in as Maëlle Kerbrat · maelle@ardentstudio.eu'));
  q('#qs').addEventListener('change', async (e) => {
    const t = e.target;
    if (t.name === 'qs-density') { st.density = t.value; render(); await post({ event: 'settings_update', section: 'quick', density: t.value }); toast('Density updated.'); }
    if (t.name === 'qs-pane') { await post({ event: 'settings_update', section: 'quick', reading_pane: t.value }); toast('Reading pane updated.'); }
  });
  side.addEventListener('click', (e) => {
    const x = e.target.closest('[data-sexp]'); if (x) { const pth = x.dataset.sexp; st.sideOpen.has(pth) ? st.sideOpen.delete(pth) : st.sideOpen.add(pth); side.innerHTML = sideHtml(currentKey()); return; }
    if (e.target.closest('#compose')) { compose(); return; }
    if (e.target.closest('#newfolder')) newFolderDialog();
  });
  function currentKey() { const p = parts(); if (p[0] === 'folder') return 'folder:' + p.slice(1).filter((x) => !/^p\d+$/.test(x)).join('/'); if (p[0] === 'msg') { const m = byId(p[1]); return m ? (SYS.some((s) => s[0] === m.f) ? m.f : 'folder:' + m.f) : ''; } return p[0] || 'inbox'; }
  function newFolderDialog() {
    const d = dialog(`<h2>New folder</h2><label for="nf-name" style="display:block;margin-bottom:4px">Please enter a new folder name:</label><input type="text" id="nf-name" style="width:100%"><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="nf-nest"> Nest folder under: <select id="nf-parent" aria-label="Parent folder">${flat.map((f) => `<option value="${f.path}">${esc(f.label)}</option>`).join('')}</select></label><div class="df"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn pri" id="nf-go">Create</button></div>`);
    d.querySelector('#nf-go').addEventListener('click', async () => { const n = norm(d.querySelector('#nf-name').value); if (!n) return; await sleep(400); await post({ event: 'folder_create', name: n, parent: d.querySelector('#nf-nest').checked ? d.querySelector('#nf-parent').value : '' }); closeDialog(); toast(`Folder “${n}” created.`); });
  }
  q('#pop-root').addEventListener('click', async (e) => {
    const pop = q('#pop'); if (!pop) return;
    const ex = e.target.closest('[data-mexp]'); if (ex) { const pth = ex.dataset.mexp; st.mvOpen.has(pth) ? st.mvOpen.delete(pth) : st.mvOpen.add(pth); pop.querySelector('#mv-body').innerHTML = moveTreeHtml(''); return; }
    const mv = e.target.closest('[data-move]'); if (mv) { await doMove(pop.dataset.ids.split(','), mv.dataset.move); return; }
    if (e.target.closest('#mv-cancel')) { closePop(); return; }
    if (e.target.closest('#mv-new')) { closePop(); newFolderDialog(); return; }
    const sz = e.target.closest('[data-snooze]');
    if (sz) { const ids = pop.dataset.ids.split(','); closePop(); for (const id of ids) { const m = byId(id); await post({ event: 'message_snooze', message_id: m.id, until: sz.dataset.snooze }); m.f = 'snoozed'; m.snooze = sz.dataset.snooze; } toast(`Snoozed until ${sz.dataset.snooze}.`); if (parts()[0] === 'msg') location.hash = '#' + st.lastList; else render(); return; }
    if (e.target.closest('#lb-apply')) {
      const labels = qa('input[data-label]:checked', pop).map((x) => x.dataset.label); const id = pop.dataset.ids; closePop();
      await post({ event: 'message_label', message_id: id, labels: labels.join(',') }); toast(labels.length ? `Labels applied: ${labels.join(', ')}.` : 'Labels removed.'); return;
    }
    const mo = e.target.closest('[data-more]');
    if (mo) {
      const m = byId(pop.dataset.ids); closePop();
      if (mo.dataset.more === 'filter') { newFbox({ from: m.e }); st.fbox.keep = true; location.hash = '#/settings/filters'; }
      if (mo.dataset.more === 'print') toast('Preparing to print…');
      if (mo.dataset.more === 'original') dialog(`<h2>Original message</h2><pre style="white-space:pre-wrap;font-size:12px;background:#f6f8fc;padding:10px;border-radius:6px">Message-ID: &lt;${m.id.toLowerCase()}@mail.postbox.eu&gt;\nFrom: ${esc(m.n)} &lt;${esc(m.e)}&gt;\nTo: Maëlle Kerbrat &lt;maelle@ardentstudio.eu&gt;\nDate: ${longDate(m.d)} +0200\nSubject: ${esc(m.s)}\nSPF: PASS · DKIM: PASS · DMARC: PASS</pre><div class="df"><button type="button" class="btn" data-close>Close</button></div>`);
      if (mo.dataset.more === 'block') {
        const d = dialog(`<h2>Block “${esc(m.n)}”?</h2><p>Future messages from ${esc(m.e)} will go to Spam.</p><div class="df"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn pri" id="blk-go">Block</button></div>`);
        d.querySelector('#blk-go').addEventListener('click', async () => { await sleep(400); await post({ event: 'sender_block', email: m.e }); BLOCKED.push(m.e); closeDialog(); toast(`${m.e} blocked.`); });
      }
    }
  });
  pane.addEventListener('click', async (e) => {
    const t = e.target;
    const tst = t.closest('[data-toast]'); if (tst) { toast(tst.dataset.toast); return; }
    const sb = t.closest('[data-star]');
    if (sb) { const m = byId(sb.dataset.star); m.st = !m.st; render(); await post({ event: 'message_star', message_id: m.id, starred: m.st ? 'yes' : 'no' }); return; }
    const ha = t.closest('[data-act]'); if (ha) { await msgAction(ha.dataset.act, [ha.dataset.mid], ha); return; }
    const bk = t.closest('[data-bulk]'); if (bk) { await msgAction(bk.dataset.bulk, [...st.sel], bk); return; }
    if (t.closest('#bulk-move')) { openMove(t.closest('#bulk-move'), [...st.sel]); return; }
    if (t.closest('#refresh')) { toast('No new mail.'); return; }
    if (t.closest('#markall')) {
      const unread = inFolder(listFolderOf(st.lastList)).filter((m) => m.u);
      if (!unread.length) { toast('No unread conversations.'); return; }
      const d = dialog(`<h2>Mark all as read?</h2><p>This marks ${unread.length} conversations in ${esc(folderLabel(listFolderOf(st.lastList)))} as read.</p><div class="df"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn pri" id="ma-go">Mark as read</button></div>`);
      d.querySelector('#ma-go').addEventListener('click', async () => { closeDialog(); await msgAction('read', unread.map((m) => m.id)); });
      return;
    }
    const ra = t.closest('[data-ract]'); if (ra) { await msgAction(ra.dataset.ract, [parts()[1]], ra); return; }
    if (t.closest('#r-move')) { if (q('#pop')) { closePop(); return; } openMove(t.closest('#r-move'), [parts()[1]]); return; }
    if (t.closest('#r-labels')) {
      if (q('#pop')) { closePop(); return; }
      const pop = placePop(t.closest('#r-labels'), `<div class="ph">Label as:</div>${['Important', 'Follow up', 'Invoices', 'Waiting'].map((l) => `<label><input type="checkbox" data-label="${l}"> ${l}</label>`).join('')}<div class="foot"><span></span><button type="button" class="tb" id="lb-apply">Apply</button></div>`, 220);
      pop.dataset.ids = parts()[1]; return;
    }
    if (t.closest('#r-more')) {
      if (q('#pop')) { closePop(); return; }
      const m = byId(parts()[1]);
      const pop = placePop(t.closest('#r-more'), `<button type="button" class="mi" data-more="filter">Filter messages like this</button><button type="button" class="mi" data-more="print">Print</button><button type="button" class="mi" data-more="original">Show original</button><button type="button" class="mi" data-more="block">Block “${esc(m.n)}”</button>`, 250);
      pop.dataset.ids = m.id; return;
    }
    const rp = t.closest('[data-reply]'); if (rp) { const m = byId(rp.dataset.reply); compose({ title: 'Reply', to: `${m.n} <${m.e}>`, subject: m.s.startsWith('Re:') ? m.s : 'Re: ' + m.s }); return; }
    const fw = t.closest('[data-fwd]'); if (fw) { const m = byId(fw.dataset.fwd); compose({ title: 'Forward', subject: 'Fwd: ' + m.s, body: `\n\n---------- Forwarded message ---------\nFrom: ${m.n} <${m.e}>\nSubject: ${m.s}\n\n${m.b}` }); return; }
    // settings
    if (t.closest('#fc-open')) { newFbox(); render(); return; }
    if (t.closest('#fc-cancel')) { st.fbox = null; render(); return; }
    if (t.closest('#fc-search')) { readCrit(); const c = st.fbox.c; const qq = [c.from && 'from:' + norm(c.from), c.subject && 'subject:' + norm(c.subject), norm(c.has)].filter(Boolean).join(' '); if (qq) location.hash = '#/search/' + encodeURIComponent(qq); return; }
    if (t.closest('#fc-next')) {
      readCrit(); const c = st.fbox.c;
      if (![c.from, c.to, c.subject, c.has, c.not].some((x) => norm(x)) && !c.attach) { const er = q('#fc-err'); er.textContent = 'Enter at least one search criterion.'; er.hidden = false; return; }
      st.fbox.step = 2; render(); return;
    }
    if (t.closest('#fc-back')) { readActs(); st.fbox.step = 1; render(); return; }
    if (t.closest('#fa-create')) { await createFilter(); return; }
    const fe = t.closest('[data-fedit]'); if (fe) { const f = FILTERS.find((x) => x.id === fe.dataset.fedit); newFbox({ ...f.crit }, { ...f.acts, apply: false }, f.id); render(); return; }
    const fd = t.closest('[data-fdelete]');
    if (fd) { const f = FILTERS.find((x) => x.id === fd.dataset.fdelete); const d = dialog(`<h2>Delete filter?</h2><p>Matches: ${critText(f.crit)}</p><div class="df"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn pri" id="fd-go">Delete</button></div>`); d.querySelector('#fd-go').addEventListener('click', async () => { await sleep(400); await post({ event: 'filter_delete', filter_id: f.id }); FILTERS = FILTERS.filter((x) => x !== f); closeDialog(); render(); toast('Filter deleted.'); }); return; }
    const ub = t.closest('[data-unblock]'); if (ub) { await post({ event: 'sender_unblock', email: ub.dataset.unblock }); BLOCKED = BLOCKED.filter((x) => x !== ub.dataset.unblock); render(); toast('Address unblocked.'); return; }
    const fv = t.closest('[data-fvis]'); if (fv) { await post({ event: 'folder_visibility', folder: fv.dataset.fvis, visible: 'no' }); toast('Folder hidden from the folder list.'); return; }
    const fdl = t.closest('[data-fdel]'); if (fdl) { const pth = fdl.dataset.fdel; const d = dialog(`<h2>Remove folder?</h2><p>Remove “${esc(folderLabel(pth))}”? Conversations in it will stay in your archive.</p><div class="df"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn pri" id="rf-go">Remove</button></div>`); d.querySelector('#rf-go').addEventListener('click', async () => { await sleep(400); await post({ event: 'folder_delete', folder: pth }); closeDialog(); toast('Folder removed.'); }); return; }
    if (t.closest('#s-newfolder')) { newFolderDialog(); return; }
    if (t.closest('#s-sendas')) { const d = dialog(`<h2>Add another email address you own</h2><label for="sa-mail" style="display:block;margin-bottom:4px">Email address</label><input type="email" id="sa-mail" style="width:100%"><div class="df"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn pri" id="sa-go">Next step</button></div>`); d.querySelector('#sa-go').addEventListener('click', async () => { const v = norm(d.querySelector('#sa-mail').value).toLowerCase(); if (!v.includes('@')) return; await sleep(400); await post({ event: 'sendas_add', email: v }); closeDialog(); toast('Verification email sent.'); }); return; }
    if (t.closest('#s-fwd-add')) { const d = dialog(`<h2>Add a forwarding address</h2><label for="fw-mail" style="display:block;margin-bottom:4px">Please enter a new forwarding email address:</label><input type="email" id="fw-mail" style="width:100%"><div class="df"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn pri" id="fw-go">Next</button></div>`); d.querySelector('#fw-go').addEventListener('click', async () => { const v = norm(d.querySelector('#fw-mail').value).toLowerCase(); if (!v.includes('@')) return; await sleep(500); await post({ event: 'forwarding_add', email: v }); closeDialog(); toast(`A confirmation code has been sent to ${v}.`); }); return; }
    const ss = t.closest('[data-ssave]');
    if (ss) {
      const box = q(`[data-sform="${ss.dataset.ssave}"]`); ss.disabled = true; await sleep(500);
      const vals = qa('select, input[type=text], textarea, input[type=radio]:checked', box).map((x) => (x.name || x.id) + '=' + x.value).join('; ');
      await post({ event: 'settings_update', section: ss.dataset.ssave, values: vals });
      if (ss.dataset.ssave === 'general') st.pageSize = +q('#sg-size').value;
      ss.disabled = false; toast('Your preferences have been saved.');
    }
  });
  pane.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('input.sel')) { t.checked ? st.sel.add(t.dataset.sel) : st.sel.delete(t.dataset.sel); render(); return; }
    if (t.id === 'selall') { const ids = qa('input.sel').map((x) => x.dataset.sel); ids.forEach((id) => (t.checked ? st.sel.add(id) : st.sel.delete(id))); render(); return; }
    if (t.id === 'fa-folder' && t.value) { q('#fa-move').checked = true; }
  });

  if (!location.hash || location.hash === '#' || location.hash === '#/') history.replaceState(null, '', '#/inbox');
  st.lastSelKey = parts().join('/');
  render();
})();
</script>
</body>
</html>
