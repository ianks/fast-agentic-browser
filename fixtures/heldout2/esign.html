  // ---------------------------------------------------------------- new envelope wizard

  function newWz(template, draft) {

    if (draft) Object.assign(w, JSON.parse(JSON.stringify({ template: draft.template, order: draft.order, rows: draft.rows, subject: draft.subject, subjectTouched: true, message: draft.message, reminders: draft.reminders, every: draft.every, expiry: draft.expiry, decline: draft.decline })), { draftId: draft.id });

  function pNew(r) {
    const key = r.slice(1).join('/');
    if (!st.wz || st.wz.key !== key) {
      const draft = r[1] === 'd' ? DRAFTS.find((d) => d.id === r[2]) : null;

      h += `<h2>Choose a template</h2><div class="tpl" role="radiogroup" aria-label="Template">${TEMPLATES.map(([id, n, d, p]) => `<label><input type="radio" name="wz-tpl" value="${id}" ${w.template === id ? 'checked' : ''}><b>${esc(n)}</b><div class="muted" style="margin-top:4px">${esc(d)}</div><div class="muted">${p} pages</div></label>`).join('')}</div>

    } else if (w.step === 1) {
      h += `<div class="inline" style="justify-content:space-between"><h2 style="margin:0">Add recipients</h2><label class="inline" style="font-weight:700"><input type="checkbox" id="wz-order" ${w.order ? 'checked' : ''}> Set signing order</label></div>
        <p class="muted">${w.order ? 'Recipients receive the envelope in order: 1 first, then 2, and so on. Give recipients the same number to send at the same time.' : 'Everyone receives the envelope at the same time.'}</p>

          ${w.order ? `<div><label for="rc-order-${i}">Order</label><input type="number" min="1" max="20" id="rc-order-${i}" data-f="order" value="${esc(rw.order)}" aria-label="Recipient ${i + 1} order"></div>` : ''}
          <div><label for="rc-name-${i}">Name</label><input type="text" id="rc-name-${i}" data-f="name" value="${esc(rw.name)}" aria-label="Recipient ${i + 1} name" autocomplete="off"></div>
          <div><label for="rc-email-${i}">Email</label><input type="email" id="rc-email-${i}" data-f="email" value="${esc(rw.email)}" aria-label="Recipient ${i + 1} email" autocomplete="off"></div>
          <div><label id="rc-role-l-${i}">Role</label><div class="lb"><button type="button" id="rc-role-${i}" data-role-btn="${i}" aria-haspopup="listbox" aria-expanded="${st.lbOpen === i}" aria-labelledby="rc-role-l-${i} rc-role-${i}">${esc(roleName(rw.role))}<span aria-hidden="true">▾</span></button>
            <ul role="listbox" aria-label="Role for recipient ${i + 1}" ${st.lbOpen === i ? '' : 'hidden'}>${ROLES.map(([v, l, d]) => `<li role="option" tabindex="-1" data-role="${v}" data-row="${i}" aria-selected="${rw.role === v}">${l}<small>${d}</small></li>`).join('')}</ul></div></div>
          <div><button type="button" class="btn sm" data-remove="${i}" aria-label="Remove recipient ${i + 1}" ${w.rows.length === 1 ? 'disabled' : ''}>✕</button></div></div>`).join('')}</div>

        <div class="field"><label for="wz-message">Email message</label><textarea id="wz-message" rows="5">${esc(w.message)}</textarea></div><p class="muted">Recipients see this in the email with the signing link.</p>`;
    } else if (w.step === 3) {
      h += `<h2>Options</h2>
        <div class="field"><label class="switch"><input type="checkbox" id="wz-rem" ${w.reminders ? 'checked' : ''} role="switch" aria-checked="${w.reminders}"><span class="tr"></span>Send automatic reminders</label></div>

        <div class="field"><label for="wz-expiry">Expire after</label><div class="inline"><input type="number" id="wz-expiry" min="1" max="365" value="${esc(w.expiry)}" style="width:110px"><span>days</span></div><div class="muted">Unsigned envelopes are voided automatically when they expire.</div></div>
        <div class="field"><label class="inline" style="font-weight:700"><input type="checkbox" id="wz-decline" ${w.decline ? 'checked' : ''}> Allow recipients to decline</label></div>

  }
  function readStep() {
    const w = st.wz; if (!w) return;
    if (w.step === 0) { const c = document.querySelector('input[name=wz-tpl]:checked'); if (c) w.template = c.value; }
    if (w.step === 1) qa('#wz-rows .rcp').forEach((el) => { const i = +el.dataset.row; const rw = w.rows[i]; qa('[data-f]', el).forEach((inp) => { rw[inp.dataset.f] = inp.dataset.f === 'order' ? inp.value : inp.value; }); });
    if (w.step === 2) { const s = q('#wz-subject'); if (s) { if (s.value !== w.subject) w.subjectTouched = true; w.subject = s.value; } const m = q('#wz-message'); if (m) w.message = m.value; }
    if (w.step === 3) { w.reminders = q('#wz-rem').checked; w.every = q('#wz-every').value; w.expiry = q('#wz-expiry').value.trim(); w.decline = q('#wz-decline').checked; }
  }
  const activeRows = (w) => w.rows.map((r, i) => ({ ...r, i })).filter((r) => norm(r.name) || r.email.trim());
  function validate(w, step) {
    const e = [];
    if (step === 0 && !w.template) e.push('Choose a template.');
    if (step === 1) {
      const rows = activeRows(w);
      const emails = new Set();
      rows.forEach((r) => {
        const n = r.i + 1;
        if (!norm(r.name)) e.push(`Recipient ${n}: enter a name.`);
        const em = r.email.trim().toLowerCase();
        if (!EMAIL.test(em)) e.push(`Recipient ${n}: enter a valid email address.`);
        else if (emails.has(em)) e.push(`Recipient ${n}: ${em} is already a recipient.`);
        emails.add(em);
        if (w.order && !/^\d{1,2}$/.test(String(r.order).trim())) e.push(`Recipient ${n}: enter an order number from 1 to 20.`);
      });
      if (!rows.some((r) => r.role === 'sign' || r.role === 'inperson')) e.push('Add at least one recipient who needs to sign.');
    }
    if (step === 2 && !norm(w.subject)) e.push('Enter an email subject.');
    if (step === 3) { if (!/^\d{1,3}$/.test(w.expiry) || +w.expiry < 1 || +w.expiry > 365) e.push('Enter an expiry between 1 and 365 days.'); }
    return e;
  }
  function payload(w) {
    const rows = activeRows(w).map((r) => ({ ...r, name: norm(r.name), email: r.email.trim().toLowerCase(), ord: Number(String(r.order).trim()) || 0 }));
    const signers = rows.filter((r) => r.role === 'sign' || r.role === 'inperson').sort((a, b) => (w.order ? a.ord - b.ord : 0) || a.i - b.i);
    const distinct = [...new Set(signers.map((r) => r.ord))].sort((a, b) => a - b);
    const fmtP = (r) => `${r.name} <${r.email}>`;
    const byName = (a, b) => a.name.localeCompare(b.name);
    return {
      template: w.template, template_name: tplName(w.template),
      signers: signers.map((r) => `${w.order ? distinct.indexOf(r.ord) + 1 : '*'}:${fmtP(r)}`).join('; '),
      cc: rows.filter((r) => r.role === 'cc').sort(byName).map(fmtP).join('; '),
      approvers: rows.filter((r) => r.role === 'approve').sort(byName).map(fmtP).join('; '),
      in_person: rows.filter((r) => r.role === 'inperson').map((r) => r.name).join('; '),
      signing_order: w.order ? 'yes' : 'no', subject: norm(w.subject), message: norm(w.message),
      reminders: w.reminders ? String(w.every) : 'off', expiry_days: String(Number(w.expiry)), allow_decline: w.decline ? 'yes' : 'no', recipient_count: String(rows.length),
    };
  }

  function render() {
    const r = route();
    qa('#mainnav a').forEach((a) => a.classList.toggle('on', a.dataset.r === r[0] || (r[0] === 'envelope' && a.dataset.r === 'envelopes')));
    if (r[0] !== 'envelope') { clearTimeout(st.promoTimer); st.menuOpen = false; }
    let h;
    if (r[0] === 'home') h = pHome();
    else if (r[0] === 'envelopes') h = pEnvelopes(FOLDERS.some((f) => f[0] === r[1]) ? r[1] : 'inbox');
    else if (r[0] === 'envelope') h = pEnvelope(r[1]);
    else if (r[0] === 'templates') h = pTemplates();
    else if (r[0] === 'new') h = pNew(r);
    else if (r[0] === 'settings') h = pSettings();
    else if (r[0] === 'upgrade') h = pUpgrade();
    else if (r[0] === 'sent') h = `<div class="panel" style="max-width:640px"><div class="alert ok"><span>✓</span><div><b>Envelope sent.</b> ${esc(st.lastSent ? st.lastSent.subject : '')}</div></div><p>Envelope ID <b>${esc(r[1])}</b>. We'll email you when recipients view and sign it.</p><a class="btn" href="#/envelopes/sent">Go to Sent</a> <a class="btn" href="#/new">Send another</a></div>`;
    else if (INFO[r[0]]) h = `<h1>${esc(INFO[r[0]][0])}</h1><div class="panel">${esc(INFO[r[0]][1])}</div>`;
    else h = `<h1>Page not found</h1><p><a href="#/home">Go home</a></p>`;
    q('#main').innerHTML = h;
  }
  function onRoute() {
    const r = route();
    if (r[0] !== 'new') st.wz = null;
    st.lbOpen = null;
    render();
    window.scrollTo(0, 0);
    if (r[0] === 'envelope' && !st.promoShown && ENVS.some((e) => e.id === r[1])) {
      clearTimeout(st.promoTimer);
      st.promoTimer = setTimeout(() => { if (route()[0] === 'envelope' && !st.promoShown) showPromo(); }, 700);
    }
  }
  window.addEventListener('hashchange', onRoute);

  function showPromo() {
    st.promoShown = true;
    q('#promo-root').innerHTML = `<div class="overlay top"><div class="dialog promo" role="dialog" aria-modal="true" aria-labelledby="promo-h">
      <button type="button" class="x" data-promo-close aria-label="Close" style="color:#fff">✕</button>
      <div class="hero"><h2 id="promo-h">Your Kestrel Business trial ends in 3 days</h2><div>Keep signing order, reminders, templates and bulk send.</div></div>
      <div class="bodyp"><ul><li>Unlimited envelopes and templates</li><li>ID verification for high-value agreements</li><li>Your logo on every signing page</li></ul><p class="muted">After 27 September you'll move to the Free plan: 3 envelopes a month.</p>
      <div class="acts"><button type="button" class="btn" data-promo-close>Remind me later</button><button type="button" class="btn pri" id="promo-upgrade">Upgrade to Business</button></div></div></div></div>`;
  }
  q('#promo-root').addEventListener('click', (e) => {
    if (e.target.closest('[data-promo-close]')) { q('#promo-root').innerHTML = ''; return; }
    if (e.target.closest('#promo-upgrade')) { q('#promo-root').innerHTML = ''; location.hash = '#/upgrade'; }
  });

  function modal(title, body, okLabel, onOk, okClass = 'pri') {
    q('#modal-root').innerHTML = `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="md-h"><button type="button" class="x" data-c aria-label="Close">✕</button><h2 id="md-h">${esc(title)}</h2>${body}<div class="err" id="md-err" role="alert" style="color:var(--bad);font-size:13px"></div><div class="acts"><button type="button" class="btn" data-c>Cancel</button><button type="button" class="btn ${okClass}" data-ok>${esc(okLabel)}</button></div></div></div>`;
    const d = q('#modal-root .dialog');
    qa('[data-c]', d).forEach((b) => b.addEventListener('click', () => (q('#modal-root').innerHTML = '')));
    d.querySelector('[data-ok]').addEventListener('click', async (ev) => {
      const b = ev.currentTarget; if (b.disabled) return;
      const errMsg = onOk.validate ? onOk.validate(d) : '';
      if (errMsg) { d.querySelector('#md-err').textContent = errMsg; return; }
      busy(b, 'Working…'); await sleep(700);
      await onOk(d);
      q('#modal-root').innerHTML = '';
    });
    return d;
  }

  // ---------------------------------------------------------------- events
  q('#main').addEventListener('click', async (e) => {
    const t = e.target;
    const tr = t.closest('tr.click[data-href]');
    if (tr && !t.closest('a')) { location.hash = tr.dataset.href; return; }
    const r = route();
    const env = r[0] === 'envelope' ? ENVS.find((x) => x.id === r[1]) : null;
    if (t.closest('#env-more')) { st.menuOpen = !st.menuOpen; render(); return; }
    const mi = t.closest('[data-menu]');
    if (mi && env) {
      st.menuOpen = false; render();
      if (mi.dataset.menu === 'history') { toast('Certificate of completion prepared (PDF).'); return; }
      if (mi.dataset.menu === 'move') {
        const f = async (d) => { const to = d.querySelector('#mv-f').value; await post({ event: 'envelope_move', envelope: env.id, folder: to }); toast(`Moved to ${to}.`); };
        modal('Move to folder', `<div class="field"><label for="mv-f">Folder</label><select id="mv-f"><option>Leases 2026</option><option>Vendors</option><option>HR</option><option>Archive</option></select></div>`, 'Move', f);
        return;
      }
      if (mi.dataset.menu === 'void') {
        const f = async (d) => { await post({ event: 'envelope_void', envelope: env.id, reason: norm(d.querySelector('#vd-r').value) }); env.status = 'voided'; env.folder = 'voided'; env.recipients.forEach((x) => (x.status = 'voided')); render(); toast('Envelope voided.'); };
        f.validate = (d) => (norm(d.querySelector('#vd-r').value) ? '' : 'Enter a reason. Recipients will see it.');
        modal('Void this envelope?', `<p>Recipients will no longer be able to view or sign it. This can't be undone.</p><div class="field"><label for="vd-r">Reason for voiding</label><textarea id="vd-r" rows="2"></textarea></div>`, 'Void envelope', f, 'danger');
        return;
      }
    }
    if (t.closest('#env-download')) { toast('Download started: ' + (env ? env.doc : 'document.pdf')); return; }
    if (t.closest('#env-sign')) { toast('Signing opens in a new window in the full product.'); return; }
    const rs = t.closest('[data-resend]');
    if (rs && env) {
      const rcp = env.recipients[+rs.dataset.resend];
      busy(rs, 'Sending'); await sleep(600);
      await post({ event: 'recipient_resend', envelope: env.id, recipient: rcp.name, email: rcp.email });
      env.audit.push(['24 Sep 2026 09:30', `Envelope resent to ${rcp.email}`]);
      if (rcp.status === 'bounced') { env.audit.push(['24 Sep 2026 09:30', `Delivery to ${rcp.email} failed: mailbox does not exist (550 5.1.1)`]); render(); toast(`We couldn't deliver the envelope to ${rcp.email}. Check the address.`); }
      else { rcp.status = 'resent'; render(); toast(`Envelope resent to ${rcp.name}.`); }
      return;
    }
    const cr = t.closest('[data-correct]');
    if (cr && env) {
      const rcp = env.recipients[+cr.dataset.correct];
      const f = async (d) => {
        const name = norm(d.querySelector('#cr-name').value), email = d.querySelector('#cr-email').value.trim().toLowerCase();
        await post({ event: 'recipient_correct', envelope: env.id, recipient: name, previous_email: rcp.email, email, resend: 'yes' });
        env.audit.push(['24 Sep 2026 09:31', `Recipient corrected: ${rcp.email} → ${email}`], ['24 Sep 2026 09:31', `Envelope resent to ${email}`]);
        rcp.name = name; rcp.email = email; rcp.status = 'resent';
        render(); toast(`${name}'s email address was corrected and the envelope was resent.`);
      };
      f.validate = (d) => {
        const name = norm(d.querySelector('#cr-name').value), email = d.querySelector('#cr-email').value.trim().toLowerCase();
        if (!name) return 'Enter a name.';
        if (!EMAIL.test(email)) return 'Enter a valid email address.';
        if (email === rcp.email && name === rcp.name) return 'Change the name or email address to correct this recipient.';
        if (env.recipients.some((x) => x !== rcp && x.email === email)) return 'Another recipient already uses this email address.';
        return '';
      };
      modal(`Correct recipient ${rcp.n}`, `<div class="field"><label for="cr-name">Name</label><input type="text" id="cr-name" value="${esc(rcp.name)}"></div><div class="field"><label for="cr-email">Email</label><input type="email" id="cr-email" value="${esc(rcp.email)}"></div><div class="alert info" style="margin:0"><span>ℹ</span><div>A new signing link will be sent to the corrected address. The old link stops working.</div></div>`, 'Correct and resend', f);
      return;
    }
    const te = t.closest('[data-tpl-edit]'); if (te) { toast('Template editing is available on Business.'); return; }
    if (t.closest('#s-save')) {
      const s = { name: norm(q('#s-name').value), title: norm(q('#s-title').value), company: norm(q('#s-company').value), notifyViewed: q('#s-viewed').checked, notifySigned: q('#s-signed').checked, notifyDaily: q('#s-daily').checked };
      const b = t.closest('#s-save'); busy(b, 'Saving'); await sleep(600);
      await post({ event: 'settings_update', name: s.name, title: s.title, company: s.company, notify_viewed: s.notifyViewed ? 'on' : 'off', notify_signed: s.notifySigned ? 'on' : 'off', notify_daily: s.notifyDaily ? 'on' : 'off' });
      st.settings = s; unbusy(b); toast('Settings saved.');
      return;
    }
    if (t.closest('#up-go')) {
      const b = t.closest('#up-go'); busy(b, 'Processing'); await sleep(900);
      await post({ event: 'plan_upgrade', plan: 'business', seats: '1' });
      unbusy(b); toast('Welcome to Kestrel Business!');
      return;
    }
    // wizard
    const w = st.wz; if (!w) return;
    const rb = t.closest('[data-role-btn]');
    if (rb) { readStep(); const i = +rb.dataset.roleBtn; st.lbOpen = st.lbOpen === i ? null : i; render(); focusOption(i); return; }
    const ro = t.closest('li[role=option][data-role]');
    if (ro) { readStep(); w.rows[+ro.dataset.row].role = ro.dataset.role; st.lbOpen = null; render(); q(`#rc-role-${ro.dataset.row}`).focus(); return; }
    const rm = t.closest('[data-remove]');
    if (rm && !rm.disabled) { readStep(); w.rows.splice(+rm.dataset.remove, 1); st.lbOpen = null; render(); return; }
    if (t.closest('#wz-add')) { readStep(); w.rows.push({ name: '', email: '', role: 'sign', order: w.rows.length + 1 }); st.lbOpen = null; render(); const n = q(`#rc-name-${w.rows.length - 1}`); if (n) n.focus(); return; }
    if (t.closest('#wz-addme')) { readStep(); if (!w.rows.some((x) => x.email.trim().toLowerCase() === ME.email)) { const empty = w.rows.find((x) => !x.name && !x.email); if (empty) { empty.name = ME.name; empty.email = ME.email; } else w.rows.push({ name: ME.name, email: ME.email, role: 'sign', order: w.rows.length + 1 }); } render(); return; }
    if (t.closest('#wz-back')) { readStep(); w.errs = []; w.step--; st.lbOpen = null; render(); return; }
    if (t.closest('#wz-next')) {
      readStep();
      w.errs = validate(w, w.step);
      if (!w.errs.length) w.step++;
      st.lbOpen = null; render(); window.scrollTo(0, 0);
      return;
    }
    if (t.closest('#wz-draft')) {
      readStep();
      if (!w.template) { w.errs = ['Choose a template before saving a draft.']; render(); return; }
      const b = t.closest('#wz-draft'); busy(b, 'Saving'); await sleep(600);
      const pay = payload(w);
      if (!w.draftId) w.draftId = 'DRAFT-' + st.draftSeq++;
      await post({ event: 'envelope_draft_save', draft_id: w.draftId, ...pay });
      const existing = DRAFTS.find((d) => d.id === w.draftId);
      const snap = { id: w.draftId, template: w.template, subject: pay.subject || 'Please sign: ' + tplName(w.template), message: w.message, order: w.order, rows: JSON.parse(JSON.stringify(w.rows)), reminders: w.reminders, every: w.every, expiry: w.expiry, decline: w.decline, updated: '24 Sep 2026' };
      if (existing) Object.assign(existing, snap); else DRAFTS.unshift(snap);
      w.errs = []; render(); toast(`Draft saved (${w.draftId}).`);
      return;
    }
    if (t.closest('#wz-send')) {
      readStep();
      for (let s = 0; s < 4; s++) { const errs = validate(w, s); if (errs.length) { w.errs = errs; w.step = s; render(); return; } }
      const b = t.closest('#wz-send'); busy(b, 'Sending'); await sleep(900);
      const pay = payload(w);
      const id = 'ENV-' + st.envSeq++;
      await post({ event: 'envelope_send', envelope_id: id, ...pay });
      const rows = activeRows(w);
      ENVS.unshift({ id, folder: 'sent', subject: pay.subject, template: w.template, sent: '24 Sep 2026, 09:35', expires: `in ${pay.expiry_days} days`, status: 'waiting', doc: tplName(w.template).replace(/\W+/g, '_') + '.pdf', pages: (TEMPLATES.find((x) => x[0] === w.template) || [0, 0, 0, 1])[3], recipients: rows.map((x, i) => ({ n: i + 1, name: norm(x.name), email: x.email.trim().toLowerCase(), role: x.role, status: x.role === 'cc' ? 'waiting' : 'sent' })), audit: [['24 Sep 2026 09:35', 'Envelope sent by Jonah Abernathy-Yu']] });
      if (w.draftId) { const i = DRAFTS.findIndex((d) => d.id === w.draftId); if (i >= 0) DRAFTS.splice(i, 1); }
      st.lastSent = pay; st.wz = null;
      location.hash = '#/sent/' + id;
      return;
    }
  });
  q('#main').addEventListener('change', (e) => {
    const t = e.target, w = st.wz;
    if (!w) return;
    if (t.id === 'wz-order') { readStep(); w.order = t.checked; w.rows.forEach((rw, i) => { if (!rw.order) rw.order = i + 1; }); render(); }
    if (t.name === 'wz-tpl') { w.template = t.value; if (!w.subjectTouched) w.subject = ''; }
    if (t.id === 'wz-rem') { t.setAttribute('aria-checked', String(t.checked)); q('#wz-rem-box').hidden = !t.checked; }
  });
  q('#main').addEventListener('input', (e) => {
    if (e.target.id === 'env-search') { st.search = e.target.value; clearTimeout(st.st); st.st = setTimeout(() => { render(); const s = q('#env-search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250); }
  });
  function focusOption(i, which) {
    if (st.lbOpen !== i) return;
    const ul = q('#rc-role-' + i) && q('#rc-role-' + i).nextElementSibling; if (!ul) return;
    const opts = qa('li[role=option]', ul);
    const cur = opts.findIndex((o) => o === document.activeElement);
    let n = opts.findIndex((o) => o.getAttribute('aria-selected') === 'true');
    if (which === 'next') n = Math.min(opts.length - 1, (cur < 0 ? n : cur) + 1);
    if (which === 'prev') n = Math.max(0, (cur < 0 ? n : cur) - 1);
    if (opts[Math.max(0, n)]) opts[Math.max(0, n)].focus();
  }
  q('#main').addEventListener('keydown', (e) => {
    const t = e.target;
    if (t.matches && t.matches('[data-role-btn]') && ['ArrowDown', 'ArrowUp'].includes(e.key)) { e.preventDefault(); readStep(); st.lbOpen = +t.dataset.roleBtn; render(); focusOption(st.lbOpen); return; }
    if (t.matches && t.matches('li[role=option][data-role]')) {
      const i = +t.dataset.row;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); focusOption(i, e.key === 'ArrowDown' ? 'next' : 'prev'); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t.click(); }
      else if (e.key === 'Tab') { readStep(); st.lbOpen = null; render(); }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (st.lbOpen !== null) { const i = st.lbOpen; st.lbOpen = null; readStep(); render(); const b = q('#rc-role-' + i); if (b) b.focus(); } }
  });
  document.addEventListener('click', (e) => {
    if (st.lbOpen !== null && !e.target.closest('.lb')) { readStep(); st.lbOpen = null; render(); }
    if (st.menuOpen && !e.target.closest('#env-more') && !e.target.closest('.menu')) { st.menuOpen = false; render(); }
  });

  onRoute();
})();
</script>
</body>
</html>
