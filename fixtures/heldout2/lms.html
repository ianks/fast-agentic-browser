  let gradeToken = 0;
  function loadGrades(code) {
    const tok = ++gradeToken;
    const ms = 300 + ((code.charCodeAt(0) * 7 + code.charCodeAt(3) * 13) % 500);
    setTimeout(() => {
      if (tok !== gradeToken) return;
      const box = q('#grades-box'); if (!box) return;
      const c = C[code], items = G[code];
      const graded = items.filter((x) => x[4] === 'graded');
      const s = graded.reduce((a, x) => a + x[2], 0), o = graded.reduce((a, x) => a + x[3], 0);
      const pct = (s / o) * 100;
      box.innerHTML = `<div class="grade-total"><span>${c.current ? 'Current grade' : 'Final grade'}:</span><b>${pct.toFixed(1)}%</b><span>(${letter(pct)})</span><span class="muted" style="margin-left:auto">${s} / ${o} points from graded work</span></div>
        <table class="t"><thead><tr><th>Name</th><th>Due</th><th>Status</th><th>Score</th><th>Out of</th></tr></thead><tbody>${items.map(([n, d, sc, oo, stt]) => `<tr><td>${esc(n)}</td><td>${d}</td><td>${stt === 'graded' ? 'Graded' : stt === 'submitted' ? 'Submitted — awaiting grade' : stt === 'excused' ? 'Excused' : 'Not yet due'}</td><td>${sc == null ? '–' : sc}</td><td>${oo}</td></tr>`).join('')}</tbody></table>
        <p class="muted">Only graded work counts towards the ${c.current ? 'current' : 'final'} grade. Excused items don’t count.</p>`;
    }, ms);
  }

  function render() {
    const r = route();
    const [a, b, c, d] = r.split('/');

    let h;
    if (a === 'dashboard') h = dashboard();

    else if (a === 'course') h = coursePage(b, c, d);

    else if (a === 'inbox') h = inboxPage();
    else if (a === 'account') h = accountPage(b, c);

    else if (a === 'files') h = filesPage();
    else h = notFound();
    q('#main').innerHTML = h;
    closeTray();

  q('#tray-close').addEventListener('click', closeTray);
  qa('[data-tray-link]').forEach((l) => l.addEventListener('click', closeTray));
  q('#logout').addEventListener('click', () => { closeTray(); confirmBox('Log out of Harrowgate Learning?', 'Log out', async () => { q('#main').innerHTML = '<div class="panel" style="max-width:420px"><h2>You’ve logged out</h2><p>Close this tab or <a href="#/dashboard">log in again</a>.</p></div>'; }); });

  function currentChannel() { const [a, b, c] = route().split('/'); return a === 'account' && b === 'notifications' && (c === 'push' ? 'push' : c === 'digest' ? null : 'email'); }
  q('#main').addEventListener('click', async (e) => {
    const t = e.target;
    const ct = t.closest('[data-ctab]'); if (ct) { st.courseTab = ct.dataset.ctab; render(); return; }
    const en = t.closest('[data-enrol]');
    if (en) { confirmBox(`Request a place on ${en.dataset.enrol}? We’ll email you to confirm and take payment.`, 'Send request', async () => { await post({ event: 'enrol_request', course: en.dataset.enrol }); toast('Request sent.'); }); return; }
    if (t.closest('#cal-prev')) { st.calMonth--; render(); return; }
    if (t.closest('#cal-next')) { st.calMonth++; render(); return; }
    const pr = t.closest('[data-post-reply]');
    if (pr) { const v = norm(q('#reply').value); if (!v) { toast('Write a reply first.'); return; } const [, code] = route().split('/'); pr.disabled = true; await sleep(500); await post({ event: 'discussion_post', course: code, thread: THREADS[code][+pr.dataset.postReply][0], body: v }); toast('Reply posted.'); render(); return; }
    const m = t.closest('[data-msg]'); if (m) { st.inbox = +m.dataset.msg; const mm = MSGS.find((x) => x.id === st.inbox); mm.unread = false; render(); return; }
    if (t.closest('#send-reply')) { const v = norm(q('#msg-reply').value); if (!v) { toast('Write a message first.'); return; } await sleep(500); await post({ event: 'message_send', to: MSGS.find((x) => x.id === st.inbox).from, body: v }); toast('Message sent.'); render(); return; }
    if (t.closest('#compose')) { openCompose(); return; }
    if (t.closest('#pf-save')) { const p = { name: norm(q('#pf-name').value), pronouns: q('#pf-pron').value, bio: norm(q('#pf-bio').value) }; await sleep(500); await post({ event: 'profile_update', display_name: p.name, pronouns: p.pronouns, bio: p.bio }); st.profile = p; toast('Profile saved.'); return; }
    if (t.closest('#pv-save')) { const p = { profile: q('#pv-profile').checked, messages: q('#pv-messages').checked, online: q('#pv-online').checked }; await sleep(500); await post({ event: 'privacy_update', show_profile: p.profile ? 'on' : 'off', allow_messages: p.messages ? 'on' : 'off', show_online: p.online ? 'on' : 'off' }); st.privacy = p; toast('Privacy settings saved.'); return; }
    const dc = t.closest('[data-disconnect]');
    if (dc) { const n = dc.dataset.disconnect; confirmBox(`Disconnect ${n}? You’ll need to sign in again to reconnect it.`, 'Disconnect', async () => { await post({ event: 'app_disconnect', app: n }); st.apps = st.apps.filter((x) => x[0] !== n); render(); toast(`${n} disconnected.`); }); return; }
    if (t.closest('#dg-save')) { await sleep(500); st.digest = q('#dg-freq').value; st.digestDue = q('#dg-due').checked; await post({ event: 'digest_update', frequency: st.digest, include_due: st.digestDue ? 'on' : 'off' }); toast('Digest settings saved.'); return; }
    const ch = currentChannel();
    if (!ch) return;
    const s = NS[ch];
    const sd = t.closest('#save-defaults');
    if (sd) {
      const vals = Object.fromEntries(NTYPES.map(([k]) => [k, q(`#def-${ch}-${k}`).checked]));
      sd.disabled = true; sd.textContent = 'Saving…'; await sleep(500);
      await post({ event: 'notification_defaults_save', channel: ch, ...Object.fromEntries(NTYPES.map(([k]) => [k, vals[k] ? 'on' : 'off'])) });
      s.defaults = vals; sd.disabled = false; sd.textContent = 'Save defaults'; toast('Default notifications saved.'); keepRender(ch); return;
    }
    const trig = t.closest('#ov-course-btn');
    if (trig) { const lb = q('#ov-lb [role=listbox]'); const open = lb.hidden; lb.hidden = !open; trig.setAttribute('aria-expanded', String(open)); return; }
    const opt = t.closest('#ov-lb [role=option]');
    if (opt) { const code = opt.dataset.code; s.pick = code; s.draft = Object.assign({}, s.overrides[code] || s.defaults); keepRender(ch); return; }
    const ed = t.closest('[data-ov-edit]');
    if (ed) { const code = ed.dataset.ovEdit; s.pick = code; s.draft = Object.assign({}, s.overrides[code]); keepRender(ch); return; }
    const rs = t.closest('[data-ov-reset]');
    if (rs) { const code = rs.dataset.ovReset; confirmBox(`Reset ${C[code].name} to your default ${ch === 'email' ? 'email' : 'push'} notifications?`, 'Reset', async () => { await post({ event: 'notification_override_reset', channel: ch, course: code }); delete s.overrides[code]; if (s.pick === code) { s.pick = null; s.draft = null; } keepRender(ch); toast('Course settings reset.'); }); return; }
    if (t.closest('#ov-cancel')) { s.pick = null; s.draft = null; keepRender(ch); return; }
    const sv = t.closest('#ov-save');
    if (sv) {
      const code = s.pick;
      const vals = Object.fromEntries(NTYPES.map(([k]) => [k, q(`#ov-${ch}-${k}`).checked]));
      sv.disabled = true; sv.textContent = 'Saving…'; await sleep(500);
      await post({ event: 'notification_override_save', channel: ch, course: code, course_name: C[code].name, ...Object.fromEntries(NTYPES.map(([k]) => [k, vals[k] ? 'on' : 'off'])) });
      s.overrides[code] = vals; s.pick = null; s.draft = null; keepRender(ch); toast(`Saved ${ch === 'email' ? 'email' : 'push'} settings for ${C[code].name}.`);
      return;
    }
  });
  q('#main').addEventListener('change', (e) => {
    const t = e.target; const ch = currentChannel();
    if (ch && t.id && t.id.startsWith(`ov-${ch}-`)) NS[ch].draft[t.dataset.k] = t.checked;
  });
  document.addEventListener('click', (e) => {
    const lb = q('#ov-lb [role=listbox]');
    if (lb && !lb.hidden && !e.target.closest('#ov-lb')) { lb.hidden = true; q('#ov-course-btn').setAttribute('aria-expanded', 'false'); }
  });
  function keepRender(ch) {
    // re-render the notifications page without losing unsaved default toggles
    const unsaved = Object.fromEntries(NTYPES.map(([k]) => [k, (q(`#def-${ch}-${k}`) || {}).checked]));
    const y = window.scrollY; render(); window.scrollTo(0, y);
    NTYPES.forEach(([k]) => { const el = q(`#def-${ch}-${k}`); if (el && unsaved[k] !== undefined) el.checked = unsaved[k]; });
  }

  function modal(html) { q('#modal-root').innerHTML = `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`; return q('#modal-root .dialog'); }
  function closeModal() { q('#modal-root').innerHTML = ''; }
  function confirmBox(msg, ok, fn) {
    const d = modal(`<h2>Please confirm</h2><p>${esc(msg)}</p><div class="actions"><button class="btn" type="button" data-c>Cancel</button><button class="btn pri" type="button" data-ok>${esc(ok)}</button></div>`);
    d.querySelector('[data-c]').onclick = closeModal;
    d.querySelector('[data-ok]').onclick = async () => { d.querySelector('[data-ok]').disabled = true; await sleep(400); closeModal(); await fn(); };
  }
  function openCompose() {
    const d = modal(`<h2>New message</h2><label class="f" for="cm-to">To</label><select id="cm-to">${COURSES.filter((c) => c.current).map((c) => `<option>${esc(c.instructor)} (${c.code})</option>`).join('')}<option>Harrowgate Learning office</option></select><label class="f" for="cm-subj">Subject</label><input type="text" id="cm-subj"><label class="f" for="cm-body">Message</label><textarea id="cm-body"></textarea><div class="actions"><button class="btn" type="button" data-c>Cancel</button><button class="btn pri" type="button" data-ok>Send</button></div>`);
    d.querySelector('[data-c]').onclick = closeModal;
    d.querySelector('[data-ok]').onclick = async () => { const subj = norm(d.querySelector('#cm-subj').value), body = norm(d.querySelector('#cm-body').value); if (!subj || !body) { toast('Add a subject and a message.'); return; } await sleep(500); await post({ event: 'message_send', to: d.querySelector('#cm-to').value, subject: subj, body }); closeModal(); toast('Message sent.'); };
  }

  if (!location.hash) history.replaceState(null, '', '#/dashboard');
  render();
})();
</script>
</body>
</html>
