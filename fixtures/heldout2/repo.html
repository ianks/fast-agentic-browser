    if (t.closest('#fork-btn')) {
      const r = curRepo();
      const m = modal('Create a new fork', `<div class="field"><label for="fork-owner">Owner</label><select id="fork-owner"><option>rkapoor</option></select></div><div class="field"><label for="fork-name">Repository name</label><input type="text" id="fork-name" value="${esc(r.name)}" style="width:100%"></div><div class="opt"><label><input type="checkbox" id="fork-main" checked> Copy the main branch only</label></div>`, `<button type="button" class="btn" data-c>Cancel</button><button type="button" class="btn primary" id="fork-ok">Create fork</button>`);
      m.querySelector('[data-c]').addEventListener('click', closeModal);
      m.querySelector('#fork-ok').addEventListener('click', async () => { closeModal(); await post({ event: 'repo_fork', repo: `${ORG}/${r.name}`, to: 'rkapoor/' + norm(m.querySelector('#fork-name').value) }); toast('Fork created.'); });
      return;
    }
    if (t.closest('#newmenu-btn')) { menuAt(t.closest('#newmenu-btn'), `<a href="#/new">New repository</a><a href="#/new">Import repository</a><a href="#/orgs/${ORG}/projects">New project</a>`); return; }
    if (t.closest('#switch-default')) {
      const r = curRepo();
      const m = modal('Switch default branch', `<div class="field"><label for="def-br">Choose another branch to use as the default branch of ${esc(r.name)}</label><select id="def-br">${r.branches.map((b) => `<option ${b === (DEFAULT_BRANCH[r.id] || 'main') ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></div>`, `<button type="button" class="btn" data-c>Cancel</button><button type="button" class="btn danger" id="def-ok">Update</button>`);
      m.querySelector('[data-c]').addEventListener('click', closeModal);
      m.querySelector('#def-ok').addEventListener('click', async () => { const b = m.querySelector('#def-br').value; closeModal(); if (b === (DEFAULT_BRANCH[r.id] || 'main')) return; await post({ event: 'default_branch_change', repo: `${ORG}/${r.name}`, branch: b }); DEFAULT_BRANCH[r.id] = b; flash = { msg: `Default branch changed to ${b}.` }; render(); });
      return;
    }
    if (t.closest('#post-cmt')) { const r = curRepo(); const v = norm(q('#cmt').value); if (!v) { toast('Comment cannot be empty.'); return; } const cmt = q('#cmt'); await post({ event: 'issue_comment', repo: `${ORG}/${r.name}`, issue: t.closest('#post-cmt').dataset.n, body: v }); cmt.value = ''; toast('Comment posted.'); return; }
    if (t.closest('#close-issue')) { const r = curRepo(); await post({ event: 'issue_close', repo: `${ORG}/${r.name}`, issue: t.closest('#close-issue').dataset.n }); toast('Issue closed.'); go(`#/${ORG}/${r.name}/issues`); return; }
    if (t.closest('#ni-submit')) { const r = curRepo(); const ti = norm(q('#ni-title').value); if (!ti) { toast('Title can’t be blank.'); return; } await post({ event: 'issue_create', repo: `${ORG}/${r.name}`, title: ti, body: norm(q('#ni-body').value) }); toast('Issue created.'); go(`#/${ORG}/${r.name}/issues`); return; }
    if (t.closest('#new-pr')) { toast('Choose two branches to compare from a local clone or the branches page.'); return; }
    if (t.closest('#labels-btn') || t.closest('#miles-btn')) { toast('Labels and milestones are managed by repository maintainers.'); return; }
    if (t.closest('#tag-add')) { const r = curRepo(); const p = q('#tag-pat').value.trim(); if (!p) return; await post({ event: 'tag_protection_add', repo: `${ORG}/${r.name}`, pattern: p }); (TAGRULES[r.id] = TAGRULES[r.id] || []).push(p); flash = { msg: 'Tag protection rule added.' }; render(); return; }
    if (t.closest('#act-save')) { const r = curRepo(); const o = { event: 'actions_settings_update', repo: `${ORG}/${r.name}`, actions: q('input[name=act-perm]:checked').value, workflow_permissions: q('input[name=wf-perm]:checked').value }; await sleep(400); await post(o); toast('Actions settings saved.'); return; }
    if (t.closest('#pg-save')) { const r = curRepo(); const o = { event: 'pages_update', repo: `${ORG}/${r.name}`, source: q('#pg-src').value, branch: q('#pg-branch').value }; await sleep(400); await post(o); toast('Pages settings saved.'); return; }
    if (t.closest('#hook-add') || t.closest('[data-hook-edit]')) {
      const r = curRepo();
      const m = modal('Add webhook', `<div class="field"><label for="hk-url">Payload URL</label><input type="url" id="hk-url" style="width:100%" placeholder="https://example.com/postreceive"></div><div class="field"><label for="hk-ct">Content type</label><select id="hk-ct"><option>application/json</option><option>application/x-www-form-urlencoded</option></select></div><div class="opt"><label><input type="radio" name="hk-ev" value="push" checked> Just the push event</label></div><div class="opt"><label><input type="radio" name="hk-ev" value="all"> Send me everything</label></div>`, `<button type="button" class="btn" data-c>Cancel</button><button type="button" class="btn primary" id="hk-ok">Add webhook</button>`);
      m.querySelector('[data-c]').addEventListener('click', closeModal);
      m.querySelector('#hk-ok').addEventListener('click', async () => { const u = m.querySelector('#hk-url').value.trim(); if (!/^https?:\/\//.test(u)) { toast('Payload URL must start with https://'); return; } closeModal(); await post({ event: 'webhook_add', repo: `${ORG}/${r.name}`, url: u, events: m.querySelector('input[name=hk-ev]:checked').value }); (HOOKS[r.id] = HOOKS[r.id] || []).push({ url: u, events: 'push', ok: true }); render(); });
      return;
    }
    const hd = t.closest('[data-hook-del]'); if (hd) { const r = curRepo(); const hk = HOOKS[r.id][+hd.dataset.hookDel]; await post({ event: 'webhook_delete', repo: `${ORG}/${r.name}`, url: hk.url }); HOOKS[r.id].splice(+hd.dataset.hookDel, 1); render(); return; }
    if (t.closest('#sec-add') || t.closest('[data-sec-edit]')) {
      const r = curRepo(); const name = t.closest('[data-sec-edit]') ? t.closest('[data-sec-edit]').dataset.secEdit : '';
      const m = modal(name ? 'Update secret' : 'New repository secret', `<div class="field"><label for="sc-name">Name</label><input type="text" id="sc-name" value="${esc(name)}" style="width:100%" ${name ? 'readonly' : ''}></div><div class="field"><label for="sc-val">Secret</label><textarea id="sc-val" style="width:100%;min-height:80px"></textarea></div>`, `<button type="button" class="btn" data-c>Cancel</button><button type="button" class="btn primary" id="sc-ok">${name ? 'Update secret' : 'Add secret'}</button>`);
      m.querySelector('[data-c]').addEventListener('click', closeModal);
      m.querySelector('#sc-ok').addEventListener('click', async () => { const n = m.querySelector('#sc-name').value.trim().toUpperCase(); if (!n || !m.querySelector('#sc-val').value) { toast('Name and secret are required.'); return; } closeModal(); await post({ event: name ? 'secret_update' : 'secret_add', repo: `${ORG}/${r.name}`, name: n }); if (!name) (SECRETS[r.id] = SECRETS[r.id] || []).push([n, 'Updated now']); render(); });
      return;
    }
    const sd = t.closest('[data-sec-del]'); if (sd) { const r = curRepo(); await post({ event: 'secret_remove', repo: `${ORG}/${r.name}`, name: sd.dataset.secDel }); SECRETS[r.id] = SECRETS[r.id].filter((x) => x[0] !== sd.dataset.secDel); render(); return; }
    if (t.closest('#dk-add')) {
      const r = curRepo();
      const m = modal('Add deploy key', `<div class="field"><label for="dk-title">Title</label><input type="text" id="dk-title" style="width:100%"></div><div class="field"><label for="dk-key">Key</label><textarea id="dk-key" style="width:100%;min-height:80px" placeholder="Begins with 'ssh-ed25519' or 'ssh-rsa'"></textarea></div><div class="opt"><label><input type="checkbox" id="dk-write"> Allow write access</label></div>`, `<button type="button" class="btn" data-c>Cancel</button><button type="button" class="btn primary" id="dk-ok">Add key</button>`);
      m.querySelector('[data-c]').addEventListener('click', closeModal);
      m.querySelector('#dk-ok').addEventListener('click', async () => { const ti = norm(m.querySelector('#dk-title').value); if (!ti || !/^ssh-/.test(m.querySelector('#dk-key').value.trim())) { toast('Enter a title and a valid public key.'); return; } closeModal(); await post({ event: 'deploy_key_add', repo: `${ORG}/${r.name}`, title: ti, write: yn(m.querySelector('#dk-write').checked) }); (DKEYS[r.id] = DKEYS[r.id] || []).push([ti, 'SHA256:…', m.querySelector('#dk-write').checked ? 'Read/write · added now' : 'Read-only · added now']); render(); });
      return;
    }
    if (t.closest('#add-people') || t.closest('#add-teams')) {
      const r = curRepo(), teams = !!t.closest('#add-teams');
      const m = modal(`Add ${teams ? 'teams' : 'people'} to ${r.name}`, `<div class="field"><label for="ap-q">Search by ${teams ? 'team name' : 'username, full name or email'}</label><input type="text" id="ap-q" style="width:100%"></div><div class="field"><label for="ap-role">Role</label><select id="ap-role"><option>Read</option><option>Triage</option><option selected>Write</option><option>Maintain</option><option>Admin</option></select></div>`, `<button type="button" class="btn" data-c>Cancel</button><button type="button" class="btn primary" id="ap-ok">Add to repository</button>`);
      m.querySelector('[data-c]').addEventListener('click', closeModal);
      m.querySelector('#ap-ok').addEventListener('click', async () => { const who = norm(m.querySelector('#ap-q').value); if (!who) { toast('Choose who to add.'); return; } closeModal(); await post({ event: 'collaborator_add', repo: `${ORG}/${r.name}`, who, role: m.querySelector('#ap-role').value }); (COLLABS[r.id] = COLLABS[r.id] || [['@tidewater-labs/platform', 'team', 'Write']]).push([who, teams ? 'team' : 'person', m.querySelector('#ap-role').value]); render(); });
      return;
    }
    const cr = t.closest('[data-collab-rm]'); if (cr) { const r = curRepo(); const list = COLLABS[r.id] || (COLLABS[r.id] = [['@tidewater-labs/platform', 'team', 'Write']]); const x = list[+cr.dataset.collabRm]; await post({ event: 'collaborator_remove', repo: `${ORG}/${r.name}`, who: x[0] }); list.splice(+cr.dataset.collabRm, 1); render(); return; }
    if (t.closest('#nr-create')) { const n = q('#nr-name').value.trim(); const e2 = q('#nr-err'); if (!/^[A-Za-z0-9._-]+$/.test(n)) { e2.textContent = 'Enter a valid repository name.'; e2.hidden = false; return; } if (byName(n)) { e2.textContent = `The repository ${n} already exists on this account.`; e2.hidden = false; return; } await post({ event: 'repo_create', owner: q('#nr-owner').value, name: n, visibility: q('input[name=nr-vis]:checked').value }); toast('Repository created.'); go(`#/${ORG}`); return; }
  });
  document.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.id === 'bp-pr') { q('#bp-pr-opts').hidden = !t.checked; return; }
    if (t.id === 'bp-sc') { q('#bp-sc-opts').hidden = !t.checked; return; }
    if (t.id === 'bp-restrict') { q('#bp-restrict-opts').hidden = !t.checked; return; }
    if (t.classList.contains('feat')) { const r = curRepo(); FEAT[r.id][t.dataset.k] = t.checked; await post({ event: 'repo_settings_update', repo: `${ORG}/${r.name}`, setting: t.dataset.k, value: t.checked ? 'on' : 'off' }); toast('Saved.'); return; }
    if (t.dataset.role != null && t.tagName === 'SELECT') { const r = curRepo(); const list = COLLABS[r.id] || (COLLABS[r.id] = [['@tidewater-labs/platform', 'team', 'Write']]); const x = list[+t.dataset.role]; x[2] = t.value; await post({ event: 'collaborator_role_change', repo: `${ORG}/${r.name}`, who: x[0], role: t.value }); toast(`${x[0]} is now ${t.value}.`); return; }
    if (t.id === 'rf-type' || t.id === 'rf-lang' || t.id === 'rf-sort') { repoFilter[t.id.slice(3)] = t.value; q('#repo-list').innerHTML = repoList(); return; }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'repo-name') { checkName(); return; }
    if (t.id === 'bp-pattern') { const r = curRepo(), v = t.value.trim(), m = matches(r, v); q('#bp-applies').textContent = v ? `Applies to ${m.length} branch${m.length === 1 ? '' : 'es'}${m.length ? ': ' + m.join(', ') : ''}` : 'Use * as a wildcard, for example release/*.'; return; }
    if (t.id === 'bp-sc-q') { RF.active = 0; drawList(); return; }
    if (t.id === 'rf-q') { repoFilter.q = t.value; const l = q('#repo-list'); const pos = t.selectionStart; l.innerHTML = repoList(); const n = q('#rf-q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch {} return; }
  });
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t.id === 'bp-sc-q') {
      const res = scResults();
      if (e.key === 'ArrowDown' && res.length) { e.preventDefault(); RF.active = Math.min(res.length - 1, RF.active + 1); drawList(); }
      else if (e.key === 'ArrowUp' && res.length) { e.preventDefault(); RF.active = Math.max(0, RF.active - 1); drawList(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (res.length) addCheck(res[RF.active]); }
      else if (e.key === 'Escape') { q('#bp-sc-list').hidden = true; }
    }
    if (t.id === 'gsearch' && e.key === 'Enter') { const v = t.value.trim(); if (v) go('#/search?q=' + encodeURIComponent(v)); }
    if (t.id === 'repo-name' && e.key === 'Enter') { e.preventDefault(); if (renameOk) doRename(); }
  });
  document.addEventListener('focusin', (e) => { if (e.target.id === 'bp-sc-q') drawList(); });
  render();
})();
</script>
</body>
</html>
