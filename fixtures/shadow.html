<!doctype html><html><head><meta charset="utf-8"><title>Speakers · DevConf</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head>
<body><header><strong>DevConf 2026</strong><a href="#">Schedule</a><a href="#">Speakers</a></header>
<main><h1>Speakers</h1><site-search></site-search>
<person-card name="Ada Lovelace" title="Analytical Engines"></person-card>
<person-card name="Grace Hopper" title="Compilers for Everyone"></person-card>
<person-card name="Alan Turing" title="Computable Numbers"></person-card>
<p id="msg" role="status"></p></main>
<script>
customElements.define('person-card', class extends HTMLElement {
  connectedCallback() {
    const r = this.attachShadow({ mode: 'open' });
    const n = this.getAttribute('name');
    r.innerHTML = `<style>article{border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0}</style><article class="card"><h3>${n}</h3><p>Talk: ${this.getAttribute('title')}</p><button>Follow</button> <button>View talk</button></article>`;
    const [f, v] = r.querySelectorAll('button');
    f.onclick = async () => { await rec({ event: 'follow', who: n }); f.textContent = 'Following'; };
    v.onclick = () => rec({ event: 'view', who: n });
  }
});
customElements.define('site-search', class extends HTMLElement {
  connectedCallback() { this.attachShadow({ mode: 'open' }).innerHTML = `<input type="search" aria-label="Search speakers"><button>Go</button>`; }
});
</script></body></html>
