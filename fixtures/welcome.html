<!doctype html><html><head><meta charset="utf-8"><title>Dashboard · Acme</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head>
<body><header><strong>Acme</strong><a href="#">Dashboard</a><a href="login.html">Sign out</a></header>
<main><h1 id="h">Welcome</h1><p>Your balance is <strong>$1,240.55</strong>.</p></main>
<script>
const p = new URLSearchParams(location.search);
q('#h').textContent = 'Welcome, ' + (p.get('user') || 'guest');
rec({ event: 'login', user: p.get('user'), pass: p.get('pass'), remember: p.get('remember') || 'off' });
q('a[href="login.html"]').onclick = (e) => { e.preventDefault(); rec({ event: 'logout', user: p.get('user') }).finally(() => { location.href = 'login.html'; }); };
</script></body></html>
