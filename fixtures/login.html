<!doctype html><html><head><meta charset="utf-8"><title>Sign in · Acme</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head>
<body>
<header><strong>Acme</strong><a href="#">Pricing</a><a href="#">Docs</a><a href="signup.html">Sign up</a></header>
<main>
  <h1>Sign in to your account</h1>
  <form id="f" action="welcome.html" method="get">
    <label for="u">Username or email</label><input id="u" name="user" type="text" autocomplete="username">
    <label for="p">Password</label><input id="p" name="pass" type="password">
    <div class="row" style="margin:10px 0"><input type="checkbox" id="rm" name="remember"><label for="rm" style="display:inline;font-weight:400">Keep me signed in</label></div>
    <div class="row"><button class="primary" type="submit">Sign in</button><a href="#">Forgot password?</a></div>
  </form>
  <p class="muted">New here? <a href="signup.html">Create an account</a></p>
  <h2>Search the docs</h2>
  <input type="search" placeholder="Search docs"><button>Search</button>
</main></body></html>
