<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mooring Market · Admin</title>
<link rel="stylesheet" href="../style.css">
<script src="../common.js"></script>
<style>
  [hidden] { display: none !important; }
  body { background: #f1f2f4; }
  .shell { display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
  .side { background: #ebebeb; padding: 14px 10px; border-right: 1px solid #d4d4d4; }
  .side .store { font-weight: 800; padding: 4px 10px 14px; }
  .side a { display: block; padding: 7px 10px; border-radius: 6px; color: #303030; text-decoration: none; }
  .side a[aria-current=page] { background: #fff; font-weight: 700; }
  .content { padding: 20px 26px; }
  .box { background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); padding: 14px 16px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #e3e3e3; margin-bottom: 12px; }
  .tabs [role=tab] { border: 0; background: none; border-bottom: 2px solid transparent; border-radius: 0; }
  .tabs [role=tab][aria-selected=true] { border-bottom-color: #303030; font-weight: 700; }
  .status { font-size: 12px; padding: 1px 8px; border-radius: 8px; background: #e3f1df; }
  .status.Draft { background: #e4e5e7; } .status.Archived { background: #f4e2e2; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; background: #fff; box-shadow: -6px 0 24px rgba(0,0,0,.15); padding: 18px 20px; z-index: 9; overflow: auto; }
  .sheet input[type=text] { width: 320px; }
  .check { font-weight: 400; display: flex; gap: 8px; align-items: center; }
  .err { color: #b91c1c; font-size: 13px; }
</style>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Admin">
    <div class="store">⚓ Mooring Market</div>
    <a href="#/home" data-top="home">Home</a><a href="#/orders" data-top="orders">Orders</a><a href="#/products" data-top="products">Products</a><a href="#/customers" data-top="customers">Customers</a><a href="#/discounts" data-top="discounts">Discounts</a><a href="#/settings" data-top="settings">Settings</a>
  </nav>
  <main class="content" id="view" style="max-width:none;margin:0"></main>
</div>
<aside class="sheet" id="sheet" hidden aria-label="Edit variant"></aside>
<div id="toast" class="toast" hidden></div>
<script>
(() => {
  const V = (len, shaft, sku, price, stock, backorder) => ({ len, shaft, sku, price, stock, backorder, track: true });
  const PRODUCTS = [
    { id: 'p1', name: 'Driftline Kayak Paddle', vendor: 'Driftline', status: 'Active', type: 'Paddles', variants: [V('220 cm', 'Carbon', 'DKP-220-CF', 189, 4, true), V('230 cm', 'Carbon', 'DKP-230-CF', 189, 0, true), V('230 cm', 'Fiberglass', 'DKP-230-FG', 139, 0, true), V('240 cm', 'Fiberglass', 'DKP-240-FG', 139, 7, false)] },
    { id: 'p2', name: 'Driftline Kayak Paddle Pro', vendor: 'Driftline', status: 'Active', type: 'Paddles', variants: [V('220 cm', 'Carbon', 'DKPP-220-CF', 279, 2, true), V('230 cm', 'Carbon', 'DKPP-230-CF', 279, 0, true)] },
    { id: 'p3', name: 'Driftline Touring Paddle', vendor: 'Driftline', status: 'Draft', type: 'Paddles', variants: [V('230 cm', 'Carbon', 'DTP-230-CF', 229, 0, true)] },
    { id: 'p4', name: 'Brisa Dry Bag 20L', vendor: 'Brisa', status: 'Active', type: 'Bags', variants: [V('20 L', 'Yellow', 'BDB-20-YL', 34, 31, false), V('20 L', 'Slate', 'BDB-20-SL', 34, 12, false)] },
    { id: 'p5', name: 'Cormorant Buoyancy Aid', vendor: 'Cormorant', status: 'Active', type: 'Safety', variants: [V('S/M', 'Red', 'CBA-SM-RD', 96, 9, false), V('L/XL', 'Red', 'CBA-LX-RD', 96, 0, true)] },
    { id: 'p6', name: 'Driftline Paddle Leash', vendor: 'Driftline', status: 'Archived', type: 'Accessories', variants: [V('One size', 'Black', 'DPL-OS-BK', 19, 0, false)] },
  ];
  const st = { search: '', tab: 'details', edit: null };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const toast = (m) => { const t = q('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 3500); };
  const view = q('#view');
  function route() {
    const p = (location.hash || '#/home').slice(2).split('/');
    qa('[data-top]').forEach((a) => (a.dataset.top === p[0] ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
    q('#sheet').hidden = true; view.onclick = null;
    if (p[0] === 'products' && p[1]) return renderProduct(p[1]);
    if (p[0] === 'products') return renderProducts();
    if (p[0] === 'home') { view.innerHTML = '<h1>Good morning, Tiago</h1><div class="box">3 orders to fulfil · 2 products out of stock with backorders enabled</div><div class="box"><strong>Tip:</strong> Turn on “Continue selling when out of stock” to accept backorders on popular items.</div>'; return; }
    view.innerHTML = `<h1>${p[0][0].toUpperCase() + p[0].slice(1)}</h1><div class="box muted">Nothing needs your attention here.</div>`;
  }
  function renderProducts() {
    const t = st.search.toLowerCase();
    const rows = PRODUCTS.filter((x) => !t || x.name.toLowerCase().includes(t) || x.vendor.toLowerCase().includes(t));
    view.innerHTML = `<h1>Products</h1><div class="box"><input type="search" id="psearch" aria-label="Search products" placeholder="Search products" value="${esc(st.search)}" style="width:320px">
      <table style="margin-top:10px"><thead><tr><th>Product</th><th>Status</th><th>Inventory</th><th>Type</th><th>Vendor</th></tr></thead><tbody>${rows.map((x) => `<tr><td><a href="#/products/${x.id}">${esc(x.name)}</a></td><td><span class="status ${x.status}">${x.status}</span></td><td>${x.variants.reduce((a, v) => a + v.stock, 0)} in stock for ${x.variants.length} variant${x.variants.length > 1 ? 's' : ''}</td><td>${x.type}</td><td>${x.vendor}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No products found.</td></tr>'}</tbody></table></div>`;
    q('#psearch').oninput = (e) => { st.search = e.target.value; renderProducts(); const i = q('#psearch'); i.focus(); };
  }
  function renderProduct(id) {
    const p = PRODUCTS.find((x) => x.id === id); if (!p) { view.innerHTML = '<p>Not found</p>'; return; }
    view.innerHTML = `<p><a href="#/products">← Products</a></p><h1>${esc(p.name)} <span class="status ${p.status}">${p.status}</span></h1>
      <div class="tabs" role="tablist">${[['details', 'Details'], ['variants', `Variants (${p.variants.length})`], ['media', 'Media'], ['seo', 'Search listing']].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${st.tab === k}">${l}</button>`).join('')}</div><div id="panel" role="tabpanel"></div>`;
    qa('[data-tab]').forEach((b) => (b.onclick = () => { st.tab = b.dataset.tab; renderProduct(id); }));
    const panel = q('#panel');
    if (st.tab === 'details') panel.innerHTML = `<div class="box"><label>Title</label><div>${esc(p.name)}</div><label>Vendor</label><div>${p.vendor}</div><label>Product type</label><div>${p.type}</div><p class="muted">Inventory and backorder settings are managed per variant.</p></div>`;
    if (st.tab === 'media') panel.innerHTML = '<div class="box muted">4 images</div>';
    if (st.tab === 'seo') panel.innerHTML = `<div class="box">mooringmarket.co/products/${p.name.toLowerCase().replace(/ /g, '-')}</div>`;
    if (st.tab === 'variants') {
      panel.innerHTML = `<div class="box"><table><thead><tr><th>Variant</th><th>SKU</th><th>Price</th><th>Available</th><th>When out of stock</th><th></th></tr></thead><tbody>${p.variants.map((v, i) => `<tr><td>${v.len} / ${v.shaft}</td><td>${v.sku}</td><td>€${v.price.toFixed(2)}</td><td>${v.stock}</td><td>${v.backorder ? 'Continue selling' : 'Stop selling'}</td><td><button type="button" data-edit="${i}" aria-label="Edit variant ${v.len} / ${v.shaft}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;
      panel.onclick = (e) => { const b = e.target.closest('[data-edit]'); if (b) openSheet(p, p.variants[+b.dataset.edit]); };
    }
  }
  function openSheet(p, v) {
    const s = q('#sheet'); s.hidden = false;
    s.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">${v.len} / ${v.shaft}</h2><button type="button" id="sh-x" aria-label="Close">✕</button></div><p class="muted">${esc(p.name)}</p>
      <label for="sh-price">Price (€)</label><input id="sh-price" type="text" value="${v.price.toFixed(2)}">
      <label for="sh-sku">SKU</label><input id="sh-sku" type="text" value="${v.sku}">
      <label for="sh-stock">Available quantity</label><input id="sh-stock" type="text" value="${v.stock}">
      <div style="margin-top:12px"><label class="check"><input type="checkbox" id="sh-track" ${v.track ? 'checked' : ''}> Track quantity</label>
      <label class="check"><input type="checkbox" id="sh-bo" ${v.backorder ? 'checked' : ''}> Continue selling when out of stock</label>
      <div class="muted" style="font-size:12px;margin-left:26px">Customers can buy this variant even when it's out of stock (backorders).</div></div>
      <div class="err" id="sh-err" role="alert" hidden></div>
      <div class="row" style="margin-top:16px"><button type="button" id="sh-cancel">Discard</button><button type="button" class="primary" id="sh-save">Save variant</button></div>`;
    const close = () => { s.hidden = true; };
    q('#sh-x').onclick = close; q('#sh-cancel').onclick = close;
    q('#sh-save').onclick = async () => {
      const price = q('#sh-price').value.replace(/[€\s]/g, ''); const stock = q('#sh-stock').value.trim(); const sku = q('#sh-sku').value.trim();
      const err = (m) => { q('#sh-err').textContent = m; q('#sh-err').hidden = !m; };
      if (!/^\d+(\.\d{1,2})?$/.test(price)) return err('Enter a valid price.');
      if (!/^-?\d+$/.test(stock)) return err('Enter a whole number.');
      err(''); q('#sh-save').disabled = true; await later(350);
      const nv = { price: +price, stock: +stock, sku, track: q('#sh-track').checked, backorder: q('#sh-bo').checked };
      await rec({ event: 'variant_update', product: p.name, variant: `${v.len} / ${v.shaft}`, sku: nv.sku, price: nv.price.toFixed(2), stock: String(nv.stock), track: nv.track ? 'yes' : 'no', backorders: nv.backorder ? 'yes' : 'no' });
      Object.assign(v, nv); close(); toast('Variant saved.'); renderProduct(p.id);
    };
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
