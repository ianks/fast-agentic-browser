    {"date": "2026-02-27", "type": "Charge", "customer": "Cedar Row Books", "country": "United States", "amount": 416.42, "desc": "Order #9948", "id": "txn_8067"},
    {"date": "2026-02-27", "type": "Charge", "customer": "Maple Hollow Bakery", "country": "Canada", "amount": 357.83, "desc": "Order #5368", "id": "txn_8060"},
    {"date": "2026-02-26", "type": "Charge", "customer": "Fjordline Knitwear", "country": "Norway", "amount": 100.52, "desc": "Order #5249", "id": "txn_8053"},
    {"date": "2026-02-26", "type": "Charge", "customer": "Cedar Row Books", "country": "United States", "amount": 334.8, "desc": "Order #1292", "id": "txn_8046"},
    {"date": "2026-02-26", "type": "Charge", "customer": "Birchwood Ceramics", "country": "United States", "amount": 316.14, "desc": "Order #2988", "id": "txn_8039"},
    {"date": "2026-02-26", "type": "Charge", "customer": "Tidal Grove Yoga", "country": "Canada", "amount": 376.47, "desc": "Order #2644", "id": "txn_8032"}
  ]/*END*/;
  const PER = 10;
  const st = { type: '', month: '', q: '', page: 1, pages: 1, rows: [], loading: false };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fd = (s) => { const [y, m, d] = s.split('-').map(Number); return `${MON[m - 1]} ${d}, ${y}`; };
  const cad = (n) => (n < 0 ? '−' : '') + 'CA$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  q('#k-gross').textContent = cad(TXNS.filter((t) => t.type === 'Charge').reduce((a, t) => a + t.amount, 0));
  q('#k-count').textContent = TXNS.length;
  qa('[data-dead]').forEach((a) => a.addEventListener('click', (e) => e.preventDefault()));
  // Simulated server: filtering + paging happen "remotely" after a delay.
  async function fetchPage() {
    st.loading = true; draw();
    await later(350);
    const all = TXNS.filter((t) => (!st.type || t.type === st.type) && (!st.month || t.date.startsWith(st.month)) && (!st.q || t.customer.toLowerCase().includes(st.q.toLowerCase())));
    st.pages = Math.max(1, Math.ceil(all.length / PER)); if (st.page > st.pages) st.page = st.pages;
    st.rows = all.slice((st.page - 1) * PER, st.page * PER); st.total = all.length; st.loading = false; draw();
  }
  function draw() {
    q('#tbl').innerHTML = `<div class="${st.loading ? 'loading' : ''}"><table aria-busy="${st.loading}"><thead><tr><th>Date</th><th>Description</th><th>Customer</th><th>Country</th><th>Type</th><th style="text-align:right">Amount</th></tr></thead><tbody>
      ${st.rows.map((t) => `<tr><td>${fd(t.date)}</td><td>${esc(t.desc)}</td><td>${esc(t.customer)}</td><td>${esc(t.country)}</td><td><span class="pill ${t.type}">${t.type}</span></td><td class="amt ${t.amount < 0 ? 'neg' : ''}">${cad(t.amount)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No transactions match these filters.</td></tr>'}</tbody></table></div>
      <div class="pager"><button type="button" id="prev" ${st.page <= 1 || st.loading ? 'disabled' : ''}>Previous</button><span>${st.loading ? 'Loading…' : `Page ${st.page} of ${st.pages} · ${st.total ?? 0} results`}</span><button type="button" id="next" ${st.page >= st.pages || st.loading ? 'disabled' : ''}>Next</button></div>`;
  }
  q('#tbl').addEventListener('click', (e) => { if (e.target.id === 'prev') { st.page--; fetchPage(); } if (e.target.id === 'next') { st.page++; fetchPage(); } });
  q('#apply').addEventListener('click', () => { st.type = q('#f-type').value; st.month = q('#f-month').value; st.q = q('#f-q').value.trim(); st.page = 1; fetchPage(); });
  q('#export').addEventListener('click', () => { alertBox('CSV exports are emailed to account owners.'); });
  function alertBox(m) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); }
  fetchPage();
})();
</script>
