<html lang="en">
<head>
<meta charset="utf-8">
<title>Larkfield CRM</title>
<link rel="stylesheet" href="../style.css">
<script src="../common.js"></script>
<style>
  [hidden] { display: none !important; }
  header { background: #14532d; }
  header a[aria-current=page] { color: #fff; font-weight: 700; text-decoration: underline; }
  main { max-width: 1100px; }
  .notice { background: #fffbeb; border: 1px solid #fde68a; padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 14px 0; }
  .toolbar input[type=search] { width: 240px; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 360px; background: #fff; border-left: 1px solid #ddd; box-shadow: -4px 0 16px rgba(0,0,0,.08); padding: 20px; overflow: auto; z-index: 8; }
  .drawer dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px; }
  .drawer dt { color: #6b7280; }
  .drawer dd { margin: 0; }
  .merge td, .merge th { vertical-align: top; }
  .merge label { font-weight: 400; display: flex; gap: 6px; align-items: flex-start; margin: 0; }
  .pager { display: flex; gap: 6px; align-items: center; margin-top: 12px; }
  .pager button[aria-current=page] { background: #14532d; color: #fff; }
  th button { background: none; border: 0; padding: 0; font-weight: 600; cursor: pointer; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .stage { font-size: 12px; padding: 1px 7px; border-radius: 9px; background: #f3f4f6; white-space: nowrap; }
  .stage.won { background: #dcfce7; } .stage.lost { background: #fee2e2; }
</style>
</head>

  function openDrawer(id) {

    const d = dupPairs();
    view.innerHTML = `<p><a href="#/contacts">← Contacts</a></p><h1>Possible duplicates</h1>${d.length ? d.map(([a, b]) => `<div class="card row" style="justify-content:space-between"><div><strong>${esc(a.name)}</strong> <span class="muted">${a.id} · ${esc(a.email)}</span><br><strong>${esc(b.name)}</strong> <span class="muted">${b.id} · ${esc(b.email)}</span></div><div class="row"><button type="button" data-dismiss="${a.id}-${b.id}">Not a duplicate</button><a class="btn" href="#/merge/${a.id}/${b.id}">Review merge</a></div></div>`).join('') : '<p class="muted">No duplicates left.</p>'}`;
    view.onclick = async (e) => { const b = e.target.closest('[data-dismiss]'); if (!b) return; b.disabled = true; await rec({ event: 'duplicate_dismiss', pair: b.dataset.dismiss }); b.closest('.card').remove(); toast('Marked as not a duplicate.'); };
    view.onchange = null;
  }

  // ---------- merge ----------
  const FIELDS = [['name', 'Name'], ['email', 'Email'], ['phone', 'Phone'], ['company', 'Company'], ['title', 'Job title'], ['owner', 'Owner']];
  function renderMerge(id1, id2) {
    const a0 = byId(id1); const b0 = byId(id2);
    if (!a0 || !b0 || a0 === b0) { view.innerHTML = '<p>Pick two different contacts to merge. <a href="#/contacts">Back to contacts</a></p>'; return; }
    // newer record is shown first
    const [L, R] = a0.created >= b0.created ? [a0, b0] : [b0, a0];
    st.merge = { L, R };
    const radio = (f, side, c) => `<label><input type="radio" name="f-${f}" value="${side}" ${side === 'L' ? 'checked' : ''}> ${esc(c[f])}</label>`;
    view.innerHTML = `<p><a href="#/contacts">← Contacts</a></p><h1>Merge contacts</h1>
      <p class="muted">Choose which record survives and which value to keep for each field. The other record is removed and its notes, emails and deals move to the surviving record.</p>
      <table class="merge"><thead><tr><th></th><th>${L.id} · created ${fmtDate(L.created)}</th><th>${R.id} · created ${fmtDate(R.created)}</th></tr></thead><tbody>
      <tr><th>Surviving record</th><td><label><input type="radio" name="primary" value="L" checked> Keep ${L.id}</label></td><td><label><input type="radio" name="primary" value="R"> Keep ${R.id}</label></td></tr>
      ${FIELDS.map(([f, lab]) => L[f] === R[f] ? `<tr><th>${lab}</th><td colspan="2">${esc(L[f])} <span class="muted">(same in both)</span></td></tr>` : `<tr><th>${lab}</th><td>${radio(f, 'L', L)}</td><td>${radio(f, 'R', R)}</td></tr>`).join('')}
      </tbody></table>
      <div class="row" style="margin-top:16px"><a class="btn" href="#/contacts">Cancel</a><button type="button" class="primary" id="do-merge">Merge contacts</button></div>`;
    view.onclick = null; view.onchange = null;
    q('#do-merge').addEventListener('click', () => {
      const pick = (n) => (qa(`input[name="${n}"]`).find((r) => r.checked) || {}).value || 'L';
      const P = pick('primary') === 'L' ? L : R; const S = P === L ? R : L;
      const out = {}; for (const [f] of FIELDS) out[f] = L[f] === R[f] ? L[f] : (pick('f-' + f) === 'L' ? L : R)[f];
      openConfirm(`Merge into ${P.id}?`, `<p>${S.id} will be deleted and its activity moved to ${P.id}. This can't be undone.</p><dl style="display:grid;grid-template-columns:90px 1fr;gap:4px">${FIELDS.map(([f, lab]) => `<dt class="muted">${lab}</dt><dd style="margin:0">${esc(out[f])}</dd>`).join('')}</dl>`, 'Merge', async () => {
        await later(500);
        await rec({ event: 'contacts_merge', primary: P.id, secondary: S.id, ...out });
        Object.assign(P, out); CONTACTS.splice(CONTACTS.indexOf(S), 1); st.sel.clear();
        toast(`Merged into ${P.id}.`); location.hash = '#/contacts';
      });
    });
  }

  // ---------- deals ----------
  const PER = 12;
  function renderDeals() {
    let rows = DEALS.filter((d) => !st.dealStage || d.stage === st.dealStage);
    if (st.dealSort) { const [k, dir] = st.dealSort; rows = rows.slice().sort((a, b) => (a[k] < b[k] ? -1 : a[k] > b[k] ? 1 : 0) * dir); }
    const pages = Math.max(1, Math.ceil(rows.length / PER)); if (st.dealPage > pages) st.dealPage = pages;
    const slice = rows.slice((st.dealPage - 1) * PER, st.dealPage * PER);
    const hdr = (k, lab, cls = '') => `<th class="${cls}"><button type="button" data-sort="${k}">${lab}${st.dealSort && st.dealSort[0] === k ? (st.dealSort[1] > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
    const stages = ['Prospecting', 'Proposal', 'Negotiation', 'Closed won', 'Closed lost'];
    view.innerHTML = `<h1>Deals</h1><div class="toolbar"><label for="stage" style="margin:0">Stage</label><select id="stage" style="width:180px"><option value="">All stages</option>${stages.map((s) => `<option ${st.dealStage === s ? 'selected' : ''}>${s}</option>`).join('')}</select><span class="muted">${rows.length} deals</span></div>
      <table><thead><tr>${hdr('id', 'ID')}${hdr('name', 'Deal')}${hdr('owner', 'Owner')}${hdr('stage', 'Stage')}${hdr('amount', 'Amount', 'num')}${hdr('close', 'Close date')}</tr></thead>
      <tbody>${slice.map((d) => `<tr><td class="muted">${d.id}</td><td>${esc(d.name)}</td><td>${esc(d.owner)}</td><td><span class="stage ${d.stage === 'Closed won' ? 'won' : d.stage === 'Closed lost' ? 'lost' : ''}">${d.stage}</span></td><td class="num">${usd(d.amount)}</td><td>${fmtDate(d.close)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No deals.</td></tr>'}</tbody></table>
      <nav class="pager" aria-label="Pagination"><button type="button" data-page="prev" ${st.dealPage === 1 ? 'disabled' : ''}>Previous</button>${Array.from({ length: pages }, (_, i) => `<button type="button" data-page="${i + 1}" ${i + 1 === st.dealPage ? 'aria-current="page"' : ''} aria-label="Page ${i + 1}">${i + 1}</button>`).join('')}<button type="button" data-page="next" ${st.dealPage === pages ? 'disabled' : ''}>Next</button><span class="muted">Page ${st.dealPage} of ${pages}</span></nav>`;
    q('#stage').addEventListener('change', (e) => { st.dealStage = e.target.value; st.dealPage = 1; renderDeals(); });
    view.onchange = null;
    view.onclick = (e) => {
      const s = e.target.closest('[data-sort]'); const p = e.target.closest('[data-page]');
      if (s) { const k = s.dataset.sort; st.dealSort = st.dealSort && st.dealSort[0] === k ? [k, -st.dealSort[1]] : [k, 1]; st.dealPage = 1; renderDeals(); }
      if (p) { const v = p.dataset.page; st.dealPage = v === 'prev' ? st.dealPage - 1 : v === 'next' ? st.dealPage + 1 : +v; renderDeals(); }
    };
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
