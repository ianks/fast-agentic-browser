<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marlowe &amp; Pine</title>
<link rel="stylesheet" href="../style.css">
<script src="../common.js"></script>
<script src="apparel_data.js"></script>
<style>
  [hidden] { display: none !important; }
  body { background: #faf9f6; }
  header { background: #2f3b2f; }
  main { max-width: 1040px; }
  .pdp { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .hero { height: 420px; background: linear-gradient(160deg, #6b705c, #a5a58d); border-radius: 4px; }
  .sw { display: flex; gap: 8px; margin: 6px 0 14px; }
  .sw button[aria-pressed=true] { outline: 2px solid #2f3b2f; outline-offset: 2px; font-weight: 700; }
  .sizes { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
  .sizes button { min-width: 64px; }
  .sizes button[aria-pressed=true] { background: #2f3b2f; color: #fff; }
  .sizes button:disabled { text-decoration: line-through; color: #a8a29e; background: #f5f5f4; cursor: not-allowed; }
  .stock { font-size: 14px; margin: 8px 0; }
  .oos { color: #b91c1c; font-weight: 600; }
  .add { width: 100%; padding: 12px; font-size: 16px; background: #2f3b2f; color: #fff; border-color: #2f3b2f; }
  .add:disabled { background: #a8a29e; border-color: #a8a29e; }
</style>
</head>
<body>
<div id="hdr"></div>
<main id="main"></main>
<div id="toast" class="toast" hidden></div>
<script>
(() => {
  const M = window.MP;
  const p = M.products.find((x) => x.id === new URLSearchParams(location.search).get('p'));
  const main = q('#main');
  const hdr = () => { q('#hdr').innerHTML = M.header(); };
  hdr();
  if (!p) { main.innerHTML = '<p>Product not found. <a href="apparel.html">Back to the shop</a></p>'; return; }
  document.title = `${p.name} · Marlowe & Pine`;
  const st = { color: Object.keys(p.colors)[0], size: null };
  const toast = (m) => { const t = q('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 3000); };
  function render() {
    const stock = p.colors[st.color]; const sizes = Object.keys(stock);
    const sel = st.size && stock[st.size] > 0 ? st.size : null;
    main.innerHTML = `<p><a href="apparel.html">← Outerwear</a></p><div class="pdp"><div class="hero" role="img" aria-label="${p.name} in ${st.color}"></div><div>
      <h1 style="margin:0">${p.name}</h1><div style="font-size:20px;margin:6px 0">£${p.price}</div><p>${p.desc}</p>
      <div><strong>Colour:</strong> ${st.color}</div><div class="sw" role="group" aria-label="Colour">${Object.keys(p.colors).map((c) => `<button type="button" data-color="${c}" aria-pressed="${c === st.color}">${c}</button>`).join('')}</div>
      <div><strong>Size</strong></div><div class="sizes" role="group" aria-label="Size">${sizes.map((s) => `<button type="button" data-size="${s}" aria-pressed="${s === st.size}" ${stock[s] ? '' : 'disabled'} aria-label="${s}${stock[s] ? '' : ' – sold out'}">${s}</button>`).join('')}</div>
      <div class="stock" role="status">${st.size ? (stock[st.size] ? (stock[st.size] <= 2 ? `Only ${stock[st.size]} left in ${st.color}, size ${st.size}` : `In stock`) : `<span class="oos">${st.color}, size ${st.size} is sold out</span>`) : sizes.filter((s) => !stock[s]).length ? `<span class="oos">${st.color} is sold out in size ${sizes.filter((s) => !stock[s]).join(', ')}</span>` : 'Choose a size'}</div>
      ${sizes.some((s) => !stock[s]) ? `<p><button type="button" id="notify">Email me when sold-out sizes are back</button></p>` : ''}
      <button type="button" class="add primary" id="add" ${sel ? '' : 'disabled'}>${sel ? 'Add to bag' : 'Select an available size'}</button>
      <p class="muted" style="font-size:13px">Free UK delivery over £150 · Free returns within 30 days</p>
      <h3>You might also like</h3><ul><li><a href="apparel_item.html?p=hebden-lite">Hebden Lite Waxed Jacket</a></li><li><a href="apparel_item.html?p=wharfe">Wharfe Wax Cap</a></li></ul></div></div>`;
  }
  main.addEventListener('click', async (e) => {
    const c = e.target.closest('[data-color]'); if (c) { st.color = c.dataset.color; st.size = null; render(); return; }
    const s = e.target.closest('[data-size]'); if (s && !s.disabled) { st.size = s.dataset.size; render(); return; }
    if (e.target.id === 'notify') { await rec({ event: 'restock_alert', product: p.name, color: st.color }); toast('We\'ll email you when it\'s back.'); return; }
    if (e.target.id === 'add') {
      const bag = M.bag(); const k = bag.find((x) => x.id === p.id && x.color === st.color && x.size === st.size);
      if (k) k.qty++; else bag.push({ id: p.id, name: p.name, color: st.color, size: st.size, qty: 1 });
      M.setBag(bag); await rec({ event: 'bag_add', product: p.name, color: st.color, size: st.size }); hdr(); toast(`${p.name} (${st.color}, ${st.size}) added to your bag.`);
    }
  });
  render();
})();
</script>
</body>
</html>
