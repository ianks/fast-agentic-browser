<!doctype html>
<html lang="en">

<meta charset="utf-8">
<title>Switchyard Desk</title>
<link rel="stylesheet" href="../style.css">

<style>
  [hidden] { display: none !important; }
  body { background: #f5f5f4; }
  .top { display: flex; gap: 14px; align-items: center; background: #292524; color: #fafaf9; padding: 8px 16px; }
  .top b { color: #fb923c; }
  .top input { width: 320px; background: #44403c; color: #fff; border-color: #57534e; }
  .wrap { display: grid; grid-template-columns: 200px 1fr; min-height: calc(100vh - 46px); }
  .wrap.split { grid-template-columns: 200px 1fr 520px; }
  .views { background: #fff; border-right: 1px solid #e7e5e4; padding: 12px 8px; }
  .views button { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: none; border-radius: 6px; padding: 7px 10px; }
  .views button[aria-current=true] { background: #ffedd5; font-weight: 700; }
  .list { padding: 14px 18px; overflow: auto; }
  table { background: #fff; font-size: 14px; }
  tr.sel td { background: #fff7ed; }
  .tag { display: inline-block; font-size: 11px; background: #f5f5f4; border: 1px solid #e7e5e4; border-radius: 4px; padding: 0 5px; margin: 1px; }
  .pri-Urgent { color: #b91c1c; font-weight: 700; } .pri-High { color: #c2410c; font-weight: 600; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .pane { border-left: 1px solid #e7e5e4; background: #fff; display: flex; flex-direction: column; }
  .pane .bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #e7e5e4; }
  .pane iframe { border: 0; flex: 1; width: 100%; min-height: 640px; }
  a.subj { color: #1d4ed8; text-decoration: none; }
</style>
</head>

  const VIEWS = [
    ['open', 'All open', (t) => t.status === 'Open'],
    ['unassigned', 'Unassigned', (t) => t.assignee === '—' && t.status !== 'Solved'],
    ['billing', 'Billing team', (t) => t.team === 'Billing'],
    ['technical', 'Technical team', (t) => t.team === 'Technical'],
    ['onboarding', 'Onboarding team', (t) => t.team === 'Onboarding'],
    ['pending', 'Pending', (t) => t.status === 'Pending'],
    ['solved', 'Solved', (t) => t.status === 'Solved'],
    ['all', 'All tickets', () => true],
  ];
  const PER = 10;
  const st = { view: 'open', page: 1, search: '', sel: null };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Shared with the ticket iframe (same origin).
  window.DESK = {
    agents: AGENTS,
    get: (id) => TICKETS.find((t) => t.id === id),
    async update(id, patch) {
      const t = TICKETS.find((x) => x.id === id);
      await rec({ event: 'ticket_update', ticket: t.id, org: t.org, assignee: patch.assignee, team: patch.team, priority: patch.priority, status: patch.status });
      Object.assign(t, patch, { updated: '2026-04-30 17:02' }); render();
    },
    async macro(id, name) { const t = TICKETS.find((x) => x.id === id); await rec({ event: 'ticket_macro', ticket: t.id, macro: name }); },
    async reply(id, text, internal) { const t = TICKETS.find((x) => x.id === id); await rec({ event: internal ? 'ticket_note' : 'ticket_reply', ticket: t.id, text }); },
  };
  function rows() {
    const f = VIEWS.find((v) => v[0] === st.view)[2]; const s = st.search.trim().toLowerCase();
    return TICKETS.filter((t) => f(t) && (!s || t.subject.toLowerCase().includes(s) || t.org.toLowerCase().includes(s) || t.id.includes(s.replace(/^#?/, '#'))));
  }
  function render() {
    q('#views').innerHTML = VIEWS.map(([k, l, f]) => `<button type="button" data-view="${k}" aria-current="${st.view === k}"><span>${l}</span><span class="muted">${TICKETS.filter(f).length}</span></button>`).join('');
    const r = rows(); const pages = Math.max(1, Math.ceil(r.length / PER)); if (st.page > pages) st.page = pages;
    const slice = r.slice((st.page - 1) * PER, st.page * PER);
    q('#list').innerHTML = `<h2 style="margin-top:0">${VIEWS.find((v) => v[0] === st.view)[1]}${st.search ? ` · matching “${esc(st.search)}”` : ''}</h2>
      <table><thead><tr><th>Ticket</th><th>Subject</th><th>Organization</th><th>Tags</th><th>Priority</th><th>Team</th><th>Assignee</th><th>Status</th><th>Updated</th></tr></thead>
      <tbody>${slice.map((t) => `<tr class="${st.sel === t.id ? 'sel' : ''}"><td>${t.id}</td><td><a class="subj" href="#" data-open="${t.id}">${esc(t.subject)}</a></td><td>${esc(t.org)}</td><td>${t.tags.map((g) => `<span class="tag">${g}</span>`).join('')}</td><td class="pri-${t.priority}">${t.priority}</td><td>${t.team}</td><td>${esc(t.assignee)}</td><td>${t.status}</td><td class="muted">${t.updated}</td></tr>`).join('') || '<tr><td colspan="9" class="muted">No tickets in this view.</td></tr>'}</tbody></table>
      <div class="pager"><button type="button" id="prev" ${st.page === 1 ? 'disabled' : ''}>‹ Newer</button><span>Page ${st.page} of ${pages} · ${r.length} tickets</span><button type="button" id="next" ${st.page === pages ? 'disabled' : ''}>Older ›</button></div>`;
  }
  q('#views').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (!b) return; st.view = b.dataset.view; st.page = 1; render(); });
  q('#list').addEventListener('click', (e) => {
    if (e.target.id === 'prev') { st.page--; render(); return; }
    if (e.target.id === 'next') { st.page++; render(); return; }
    const a = e.target.closest('[data-open]'); if (!a) return; e.preventDefault();
    st.sel = a.dataset.open; render();
    q('#pane').hidden = false; q('#wrap').classList.add('split'); q('#pane-title').textContent = 'Ticket ' + st.sel;
    q('#ticket-frame').setAttribute('src', 'desk_ticket.html?id=' + encodeURIComponent(st.sel));
  });
  q('#pane-close').addEventListener('click', () => { q('#pane').hidden = true; q('#wrap').classList.remove('split'); st.sel = null; q('#ticket-frame').removeAttribute('src'); render(); });
  let t0; q('#search').addEventListener('input', (e) => { const v = e.target.value; clearTimeout(t0); t0 = setTimeout(() => { st.search = v; st.page = 1; render(); }, 200); });
