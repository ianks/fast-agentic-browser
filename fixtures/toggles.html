<!doctype html><html><head><meta charset="utf-8"><title>Notifications · Settings</title><link rel="stylesheet" href="style.css"><script src="common.js"></script>
<style>[role=switch]{width:44px;height:24px;border-radius:12px;padding:0}[role=switch][aria-checked=true]{background:#2563eb}.set{display:flex;justify-content:space-between;align-items:center;width:420px;padding:8px 0;border-bottom:1px solid #eee}</style></head>
<body><header><strong>Settings</strong><a href="#">Account</a><a href="#">Notifications</a><a href="#">Privacy</a></header>
<main><h1>Notifications</h1>
<div class="set"><span id="l1">Email notifications</span><button role="switch" aria-checked="true" aria-labelledby="l1" data-k="email"></button></div>
<div class="set"><span id="l2">SMS notifications</span><button role="switch" aria-checked="false" aria-labelledby="l2" data-k="sms"></button></div>
<div class="set"><span id="l3">Push notifications</span><button role="switch" aria-checked="true" aria-labelledby="l3" data-k="push"></button></div>
<h2>Appearance</h2>
<div class="set"><span id="l4">Dark mode</span><button role="switch" aria-checked="false" aria-labelledby="l4" data-k="dark"></button></div>
<div class="set"><span id="l5">Weekly digest</span><button role="switch" aria-checked="true" aria-labelledby="l5" data-k="digest"></button></div>
<div class="row" style="margin-top:16px"><button id="reset">Reset to defaults</button><button class="primary" id="save">Save changes</button></div><p id="st" role="status"></p></main>
<script>
qa('[role=switch]').forEach((s) => s.onclick = () => s.setAttribute('aria-checked', String(s.getAttribute('aria-checked') !== 'true')));
q('#reset').onclick = () => rec({ event: 'reset' });
q('#save').onclick = async () => { const o = { event: 'save' }; qa('[role=switch]').forEach((s) => o[s.dataset.k] = s.getAttribute('aria-checked')); await rec(o); q('#st').textContent = 'Saved.'; };
</script></body></html>
