  mr.addEventListener('click', async (e) => {
    const m = st.modal; if (!m) return; const t = e.target;
    const pl = t.closest('[data-place]'); if (pl) { m.place = pl.dataset.place; m.placeQ = m.place; renderModal(); return; }
    if (t.closest('#fm-cancel')) { st.modal = null; renderModal(); return; }
    if (t.closest('#fm-save')) {
      m.err = '';
      if (!m.type) m.err = 'Choose a fact type.';
      else if (m.year && !/^\d{4}$/.test(m.year.trim())) m.err = 'Year must have four digits.';
      else if (!m.year.trim() && (m.day || m.month)) m.err = 'Add a year.';
      else if (m.placeQ.trim() && !m.place) m.err = 'Choose the place from the list of standardized places.';
      if (m.err) { renderModal(); return; }
      st.busy = true; renderModal(); await later(700);
      const date = [m.qual, m.day, m.month, m.year.trim()].filter(Boolean).join(' ');
      const p = PEOPLE[m.person];
      await rec({ event: 'fact_add', person: m.person, person_name: p.name, type: m.type, date, place: m.place, description: m.desc.trim() });
      const shown = (m.qual ? { ABT: 'abt. ', BEF: 'bef. ', AFT: 'aft. ', EST: 'est. ' }[m.qual] : '') + [m.day, m.month && m.month[0] + m.month.slice(1).toLowerCase(), m.year.trim()].filter(Boolean).join(' ');
      p.facts.push(f(m.type, shown, m.place, m.desc.trim()));
      st.busy = false; st.modal = null; renderModal(); route(); toast('Fact added');
    }
  });
  route();
})();
</script>
</body>
</html>
